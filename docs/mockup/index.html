<title>Rekonoce Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;1,400&display=swap">
  <style>
/* Rekonoce · sistema de diseño Kibernum v3: blanco y gris cálido, tinta casi negra, verde y lila como gestos mínimos. */
:root{
  --bg:#FFFFFF; --warm:#F9F8F7; --ink:#2C2C2B; --ink-2:#474747; --ink-3:#5F5E5A; --grey:#A5A3A2;
  --line:#E6E5E3; --line-2:#D0D0CD; --green:#B2D5AD; --green-wash:#DDE8D7; --green-fresh:#C6ECBB;
  --lilac:#B6AAD1; --lilac-wash:#ECE8F4; --silver:#C2C2C2; --alert:#A4262C; --alert-wash:#FDEBEC;
  --font:"Gilroy","Poppins",Arial,sans-serif; --r:6px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--warm)}
body{color:var(--ink-3);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:var(--ink)}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

/* Contenedor del app: una columna de teléfono, centrada en pantallas grandes */
.app{position:relative;isolation:isolate;max-width:480px;height:100%;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);-webkit-overflow-scrolling:touch}
.tabs{flex:0 0 auto;display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:6px 8px max(12px,env(safe-area-inset-bottom,0px));background:var(--bg)}
.tabs button{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--ink-3);min-width:64px;min-height:48px;padding-top:4px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--ink);font-weight:600}
.tabs .dot{width:4px;height:4px;border-radius:50%;background:transparent}
.tabs button[aria-current="true"] .dot{background:var(--green)}
.busybar{position:absolute;top:0;left:0;right:0;height:2px;overflow:hidden;z-index:30}
.busybar i{display:block;height:100%;width:40%;background:var(--lilac);animation:busy 1s linear infinite}
@keyframes busy{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* Tipografía y piezas base */
.kicker{font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.ray{display:block;width:24px;height:2px;background:var(--lilac);flex:0 0 auto}
.wm{font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--ink)}
.screenwrap{display:flex;flex-direction:column;min-height:100%;flex:1 0 auto}
.screenwrap > *,.pad > *{flex-shrink:0}
.pad{padding:12px 22px 24px;display:flex;flex-direction:column;gap:18px}
/* Las grillas nunca se ensanchan por el contenido (campos de texto, nombres largos) */
.card,.hgroup,.group,.fin,.list,.wgrid,.field,.sheet,.reasons{grid-template-columns:minmax(0,1fr)}
.card > *,.group > *,.fin > *,.list > *,.field > *{min-width:0}
.appbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 22px 0;min-height:48px}
.back{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);min-height:44px;padding-right:8px}
.back svg{width:18px;height:18px}
.hgroup{display:grid;gap:8px;min-width:0}
.h1{font-weight:600;font-size:25px;line-height:1.2;color:var(--ink);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.h2{font-weight:600;font-size:17px;line-height:1.3;color:var(--ink);margin:0}
.lead{font-size:14.5px;color:var(--ink-3);margin:0}
.small{font-size:12.5px;color:var(--ink-3);margin:0}
p{margin:0}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* Pines: el tamaño de la imagen siempre se fija en px desde el script */
.medal{border-radius:50%;background:var(--warm);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}
.medal img{display:block;object-fit:contain;max-width:none;flex:0 0 auto}
.medal.done{border-color:var(--green);background:var(--bg)}
.pins2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pins2 > div{display:flex;align-items:center;gap:10px;min-width:0}
.pins2 small{font-size:12.5px;color:var(--ink-2);min-width:0;overflow-wrap:anywhere;line-height:1.3}

/* Listas */
.list{display:grid;border-top:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;min-height:64px}
.prow .t{flex:1;min-width:0;display:grid}
.prow .t b{font-weight:600;font-size:15px;color:var(--ink)}
.prow .t span{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.st{font-size:11.5px;font-weight:600;color:var(--ink);background:var(--green-wash);border-radius:999px;padding:3px 10px;white-space:nowrap;flex:0 0 auto}
.st.pend{background:transparent;border:1px solid var(--line-2);color:var(--ink-3);font-weight:400}
.st.lil{background:var(--lilac-wash)}
.st.alert{background:var(--alert-wash);color:var(--alert)}
.card{background:var(--warm);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;width:100%}
.btn{display:block;width:100%;text-align:center;background:var(--ink);color:#fff;border-radius:var(--r);padding:13px 14px;font-weight:600;font-size:15px;min-height:50px}
.btn[disabled]{background:var(--line);color:var(--ink-3);cursor:not-allowed}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--silver)}
.btn.sm{min-height:44px;font-size:14px;padding:10px 12px}
.link{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2);width:100%;min-height:44px}
.quote{border-left:3px solid var(--green);padding:2px 0 2px 14px;font-style:italic;color:var(--ink-2);font-size:14px;overflow-wrap:anywhere;margin:0}
.num{font-size:28px;font-weight:600;color:var(--green);line-height:1;min-width:40px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink);border:1px solid var(--line);flex:0 0 auto}
.av{overflow:hidden}
.av img{display:block;object-fit:cover;max-width:none;flex:0 0 auto}
.rv-faces{display:flex;gap:10px;justify-content:center;margin-top:-6px}
.rv-faces .av{border:2px solid var(--bg)}
.a-delivery{background:var(--green-wash)}
.a-talent{background:var(--lilac-wash)}
.a-support{background:var(--warm)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:var(--r);padding:0 12px;min-height:46px;background:var(--bg)}
.search input{border:0;outline:0;font-size:16px;flex:1;min-width:0;width:100%;height:44px;background:transparent}
.search svg{width:16px;height:16px;color:var(--ink-3);flex:0 0 auto}
.group{display:grid;gap:6px}
.gh{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);padding-top:6px}
.gh span{color:var(--ink-3);font-weight:400;letter-spacing:0;text-transform:none}
.person{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);width:100%;min-height:56px;background:var(--bg)}
.person .t{flex:1;min-width:0}
.person b{font-weight:600;font-size:14.5px;color:var(--ink);display:block;overflow-wrap:anywhere}
.person small{font-size:12px;color:var(--ink-3);display:block}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);flex:0 0 auto}
[aria-checked="true"]{border-color:var(--ink)}
[aria-checked="true"] .radio{border:6px solid var(--ink)}
.person[disabled],.fin[disabled],.prow[disabled]{opacity:.5;cursor:not-allowed}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:12px 22px 14px;border-top:1px solid var(--line);margin-top:auto;z-index:2}
textarea{width:100%;min-height:140px;border:1px solid var(--line-2);border-radius:var(--r);padding:14px;font-size:16px;resize:none;line-height:1.5;background:var(--bg)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--ink)}
.count{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3)}
.count b{font-weight:600;color:var(--ink)}
.starts{display:flex;flex-wrap:wrap;gap:6px}
.starts button{border:1px solid var(--line-2);border-radius:999px;padding:0 14px;min-height:44px;font-size:13px;color:var(--ink-2)}
.fin{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);width:100%;background:var(--bg)}
.fin .row{display:flex;align-items:center;gap:12px}
.fin .row .t{flex:1;min-width:0}
.fin .row b{font-weight:600;color:var(--ink);font-size:15px;display:block;overflow-wrap:anywhere}
.fin .quote{font-size:13px}
.toast{display:flex;gap:10px;align-items:center;background:var(--green-wash);border-radius:var(--r);padding:12px 14px;color:var(--ink);font-size:13.5px}
.toast.err{background:var(--alert-wash);color:var(--alert)}
.toast svg{flex:0 0 auto}
.notice{background:var(--lilac-wash);border-radius:var(--r);padding:14px;color:var(--ink);font-size:13.5px;display:grid;gap:4px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 22px;text-align:center}

/* Contador */
.cd{display:grid;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}
.cd .lbl{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 8px;font-size:12px;color:var(--ink-3)}
.cd .lbl b{color:var(--ink);font-weight:600}
.cd .digits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cd .digits div{display:grid;justify-items:center;gap:2px}
.cd .digits b{font-size:30px;font-weight:600;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.cd .digits div:first-child b{color:var(--green)}
.cd .digits span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.cd.over .digits b{color:var(--ink-3)}

/* Aviso de anonimato y PIN */
.shield{width:56px;height:56px;border-radius:50%;background:var(--green-wash);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.shield svg{width:26px;height:26px}
.pinDots{display:flex;gap:16px;justify-content:center;padding:8px 0}
.pinDots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
.pinDots i.on{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.keypad button{min-height:60px;border-radius:var(--r);border:1px solid var(--line);font-size:22px;font-weight:600;color:var(--ink);text-align:center;background:var(--bg)}
.keypad button.ghost{border-color:transparent;font-size:13px;font-weight:400;color:var(--ink-3)}
.err{color:var(--alert);font-size:13px;text-align:center;min-height:20px;margin:0}

/* Administrador */
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stepper div{display:grid;gap:6px;min-width:0}
.stepper i{height:4px;border-radius:2px;background:var(--line)}
.stepper .done i{background:var(--green)}
.stepper .now i{background:var(--ink)}
.stepper span{font-size:11px;color:var(--ink-3);line-height:1.25;overflow-wrap:anywhere}
.stepper .now span{color:var(--ink);font-weight:600}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.kpi > span{display:grid;gap:2px;min-width:0}
.kpi b{font-size:34px;font-weight:600;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi b.g{color:var(--green)}
.kpi b small{font-size:18px;color:var(--ink-3)}
.kpi em{font-style:normal;font-size:12px;color:var(--ink-3)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{min-height:44px;text-align:center;font-size:13.5px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.vrow b{font-weight:600;font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.vrow b small{font-weight:400;color:var(--ink-3);font-size:12px}
.vrow em{font-style:normal;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;font-size:14px}
.vrow .bar{grid-column:1 / -1}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink)}
.field input,.field select{border:1px solid var(--line-2);border-radius:var(--r);min-height:46px;padding:0 12px;background:var(--bg);width:100%;font-size:16px}

/* Hoja inferior */
.scrim{position:absolute;inset:0;background:rgba(44,44,43,.38);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:10px 22px max(24px,env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:88%;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);justify-self:center}

/* Revelación */
.rv{position:relative;flex:1 0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:8px 22px 24px;background:var(--warm);min-height:100%}
.rv .count3{flex:1;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:600;color:var(--green);line-height:1;min-height:360px}
.rings{position:relative;width:216px;height:216px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin:14px 0}
.rings .r{position:absolute;inset:0;border-radius:50%;border:1px solid var(--lilac)}
.rings .r2{inset:16px;border-color:var(--green)}
.rings .r3{inset:-14px;border-color:var(--line-2)}
.rings .medal{position:relative;z-index:1}
.rv .nm{font-weight:600;font-size:30px;line-height:1.15;color:var(--ink);margin:0;overflow-wrap:anywhere}
.rv .nm span{display:inline-block}
.rv .reasons{display:grid;gap:10px;width:100%;text-align:left}
.rv .reasons .quote{background:var(--bg);border-radius:0 var(--r) var(--r) 0;padding:10px 14px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--ink)}
canvas.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.wgrid{display:grid;gap:0}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.wrow .t{flex:1;display:grid;min-width:0}
.wrow .t span{font-size:11.5px;color:var(--ink-3)}
.wrow .t b{font-weight:600;color:var(--ink);font-size:14.5px;overflow-wrap:anywhere}

@media (prefers-reduced-motion:no-preference){
  .enter{animation:enter .28s cubic-bezier(.2,.8,.2,1) both}
  @keyframes enter{from{opacity:.3;transform:translateX(10px)}}
  .toast{animation:pop .45s ease-out both}
  @keyframes pop{0%{transform:scale(.96);opacity:.4}60%{transform:scale(1.02)}}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .count3 span{animation:tick .7s cubic-bezier(.2,.8,.2,1) both;display:inline-block}
  @keyframes tick{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
  .rings .r{animation:ring 1s cubic-bezier(.2,.8,.2,1) both}
  .rings .r2{animation-delay:.12s}.rings .r3{animation-delay:.24s}
  @keyframes ring{from{transform:scale(.4);opacity:0}}
  .rings .medal{animation:drop .9s cubic-bezier(.34,1.56,.64,1) .1s both}
  @keyframes drop{from{transform:translateY(-120px) rotate(-25deg) scale(.6);opacity:0}}
  .rv .nm span{animation:letter .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes letter{from{transform:translateY(18px);opacity:0}}
  .rv .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{transform:translateY(16px);opacity:0}}
  .sheet{animation:up .3s cubic-bezier(.2,.8,.2,1) both}
  @keyframes up{from{transform:translateY(40px);opacity:.5}}
}
/* Teléfonos muy angostos (320 px) */
@media (max-width:359px){
  .pad{padding-left:16px;padding-right:16px}
  .appbar,.sticky{padding-left:16px;padding-right:16px}
  .prow{gap:10px}
  .st{padding:3px 8px}
  .h1{font-size:23px}
}
@media (prefers-reduced-motion:reduce){.busybar i{animation:none;width:100%;opacity:.6}}
</style>

<script>/* Almacenamiento en memoria con la misma interfaz que sheetStore_() de Code.gs. Lo usan las pruebas y el arnés local. */
(function (root) {
  function clone(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }
  function makeMemStore(team, pin) {
    var db = {
      config: { stage: 'idle' },
      people: team.map(function (r) { return { id: r[0], name: r[1], area: r[2], note: r[3], active: r[4] }; }),
      part: [], nom: [], fin: [], hist: []
    };
    return {
      db: db,
      getAdminPin: function () { return pin; },
      getConfig: function () { return clone(db.config); },
      setConfig: function (p) { Object.keys(p).forEach(function (k) { db.config[k] = clone(p[k] === undefined ? null : p[k]); }); },
      getPeople: function () { return clone(db.people); },
      getParticipation: function (c) { return db.part.filter(function (r) { return r.cycle === c; }).map(function (r) { return { stage: r.stage, person: r.person, ts: r.ts }; }); },
      addParticipation: function (c, s, p, ts) { db.part.push({ cycle: c, stage: s, person: p, ts: ts }); },
      getBallots: function (k, c) { return db[k].filter(function (b) { return b.cycle === c; }).map(function (b) { return { pillar: b.pillar, nominee: b.nominee, reason: k === 'nom' ? b.reason : '' }; }); },
      addBallots: function (k, c, list) {
        list.forEach(function (b) {
          var row = { cycle: c, pillar: b.pillar, nominee: b.nominee };
          if (k === 'nom') row.reason = b.reason;
          db[k].splice(Math.floor(Math.random() * (db[k].length + 1)), 0, row);
        });
      },
      getHistory: function () { return clone(db.hist).reverse(); },
      addHistory: function (e) { db.hist.push(clone(e)); }
    };
  }
  function makeMemAuth() {
    var tokens = {}, fails = 0;
    return {
      issue: function () { var t = 't' + Math.random().toString(36).slice(2); tokens[t] = true; return t; },
      check: function (t) { return !!t && !!tokens[t]; },
      fails: function () { return fails; },
      addFail: function () { fails++; },
      resetFails: function () { fails = 0; }
    };
  }
  root.makeMemStore = makeMemStore;
  root.makeMemAuth = makeMemAuth;
})(typeof module !== 'undefined' ? module.exports : window);
</script>
<script>/**
 * Rekonoce · lógica de negocio pura.
 *
 * No usa ningún servicio de Google: recibe un "store" (dónde se guardan los datos)
 * y un "auth" (tokens de administrador). Así la misma lógica corre en Apps Script
 * (Code.gs, con Google Sheets) y en las pruebas locales (qa/, con memoria).
 *
 * Anonimato: la participación (quién votó) y las papeletas (por quién se votó)
 * se guardan en tablas separadas. Las papeletas no llevan nombre ni hora.
 */
var RK = (function () {
  var PILLARS = ['colaboracion', 'responsabilidad', 'respeto', 'comunicacion'];
  var PILLAR_NAMES = {
    colaboracion: 'Colaboración', responsabilidad: 'Responsabilidad',
    respeto: 'Respeto', comunicacion: 'Comunicación'
  };
  var STAGES = ['idle', 'nominacion', 'finalistas', 'cerrado', 'revelado'];
  var MIN_REASON = 40;
  var MAX_REASON = 600;
  var MAX_PIN_FAILS = 5;

  function fail(msg) {
    var e = new Error(msg);
    e.userFacing = true;
    throw e;
  }

  function peopleIndex(people) {
    var m = {};
    people.forEach(function (p) { m[p.id] = p; });
    return m;
  }

  function activePeople(people) {
    return people.filter(function (p) { return p.active; });
  }

  /** Votos por persona en un pilar, de mayor a menor (desempate alfabético estable). */
  function tally(ballots, pillar, idx) {
    var m = {};
    ballots.forEach(function (b) {
      if (b.pillar === pillar && b.nominee) m[b.nominee] = (m[b.nominee] || 0) + 1;
    });
    return Object.keys(m).map(function (id) { return { id: id, votes: m[id] }; })
      .sort(function (a, b) {
        if (b.votes !== a.votes) return b.votes - a.votes;
        var na = idx[a.id] ? idx[a.id].name : a.id;
        var nb = idx[b.id] ? idx[b.id].name : b.id;
        return na.localeCompare(nb);
      });
  }

  /** Las 3 personas más nominadas por pilar. Si hay empate en el 3er lugar, pasan todas las empatadas. */
  function computeFinalists(nomBallots, people) {
    var idx = peopleIndex(people);
    var out = {};
    PILLARS.forEach(function (pid) {
      var t = tally(nomBallots, pid, idx).filter(function (x) { return idx[x.id] && idx[x.id].active; });
      if (!t.length) { out[pid] = []; return; }
      var cut = t[Math.min(2, t.length - 1)].votes;
      out[pid] = t.filter(function (x) { return x.votes >= cut; }).map(function (x) { return x.id; });
    });
    return out;
  }

  /** Ganador por pilar: más votos finales; empate, más votos en nominación; si sigue, pin compartido. */
  function computeWinners(finBallots, nomBallots, finalists, people) {
    var idx = peopleIndex(people);
    var out = {};
    PILLARS.forEach(function (pid) {
      var nom = {};
      tally(nomBallots, pid, idx).forEach(function (x) { nom[x.id] = x.votes; });
      var fin = {};
      tally(finBallots, pid, idx).forEach(function (x) { fin[x.id] = x.votes; });
      var rank = (finalists[pid] || []).map(function (id) {
        return { id: id, final: fin[id] || 0, nom: nom[id] || 0 };
      }).sort(function (a, b) { return (b.final - a.final) || (b.nom - a.nom); });
      var top = rank.length ? rank.filter(function (r) {
        return r.final === rank[0].final && r.nom === rank[0].nom;
      }) : [];
      out[pid] = { winners: top.map(function (r) { return r.id; }), votes: top.length ? top[0].final : 0, rank: rank };
    });
    return out;
  }

  function reasonsFor(nomBallots, pillar, id) {
    return nomBallots.filter(function (b) { return b.pillar === pillar && b.nominee === id && b.reason; })
      .map(function (b) { return b.reason; });
  }

  function participationMap(rows, stage) {
    var m = {};
    rows.forEach(function (r) { if (r.stage === stage) m[r.person] = r.ts; });
    return m;
  }

  function requireStage(cfg, stage) {
    if (cfg.stage !== stage) fail('Esta acción no está disponible en la etapa actual. Actualiza la pantalla.');
  }

  function validDeadline(ts, now) {
    ts = Number(ts);
    if (!ts || isNaN(ts) || ts <= now) fail('Elige una fecha y hora futura.');
    if (ts > now + 120 * 864e5) fail('La fecha límite no puede estar a más de 120 días.');
    return ts;
  }

  /* ---------- Estado público (lo que ve cualquier persona) ---------- */
  function publicState(store, personId, now) {
    var cfg = store.getConfig();
    var people = store.getPeople();
    var idx = peopleIndex(people);
    var active = activePeople(people);
    var part = cfg.cycleId ? store.getParticipation(cfg.cycleId) : [];
    var nomMap = participationMap(part, 'nom');
    var finMap = participationMap(part, 'fin');
    var st = cfg.stage || 'idle';
    var state = {
      serverNow: now,
      people: people.map(function (p) { return { id: p.id, name: p.name, area: p.area, note: p.note, active: p.active }; }),
      cycle: { month: cfg.month || '', stage: st, nomDeadline: cfg.nomDeadline || null, finDeadline: cfg.finDeadline || null },
      activeCount: active.length,
      counts: {
        nom: active.filter(function (p) { return nomMap[p.id]; }).length,
        fin: active.filter(function (p) { return finMap[p.id]; }).length
      },
      me: null,
      finalists: null,
      winners: null,
      history: store.getHistory()
    };
    if (personId && idx[personId]) {
      state.me = { id: personId, votedNom: !!nomMap[personId], votedFin: !!finMap[personId] };
    }
    if (st === 'finalistas' || st === 'cerrado' || st === 'revelado') {
      var nomB = store.getBallots('nom', cfg.cycleId);
      var fs = cfg.finalists || {};
      state.finalists = {};
      PILLARS.forEach(function (pid) {
        state.finalists[pid] = (fs[pid] || []).map(function (id) {
          var rs = reasonsFor(nomB, pid, id);
          return { id: id, excerpt: rs.length ? rs[0] : '' };
        });
      });
      if (st === 'revelado' && cfg.winners) {
        state.winners = {};
        PILLARS.forEach(function (pid) {
          var w = cfg.winners[pid] || { winners: [], votes: 0 };
          var reasons = [];
          w.winners.forEach(function (id) { reasons = reasons.concat(reasonsFor(nomB, pid, id)); });
          state.winners[pid] = { ids: w.winners, votes: w.votes, reasons: reasons };
        });
      }
    }
    return state;
  }

  /* ---------- Votar ---------- */
  function nominate(store, personId, noms, now) {
    var cfg = store.getConfig();
    var people = store.getPeople();
    var idx = peopleIndex(people);
    var me = idx[personId];
    if (!me || !me.active) fail('No encontramos tu nombre en el equipo activo.');
    requireStage(cfg, 'nominacion');
    if (now > cfg.nomDeadline) fail('El plazo de nominación ya terminó.');
    var part = store.getParticipation(cfg.cycleId);
    if (participationMap(part, 'nom')[personId]) fail('Ya enviaste tus nominaciones este mes.');
    if (!noms || typeof noms !== 'object') fail('Faltan tus nominaciones.');
    var rows = [];
    PILLARS.forEach(function (pid) {
      var n = noms[pid];
      if (!n) fail('Falta tu nominación en ' + PILLAR_NAMES[pid] + '.');
      if (n.skip) { rows.push({ pillar: pid, nominee: '', reason: '' }); return; }
      var target = idx[n.nominee];
      if (!target || !target.active) fail('La persona elegida en ' + PILLAR_NAMES[pid] + ' no está disponible.');
      if (n.nominee === personId) fail('No puedes nominarte a ti mismo.');
      var reason = String(n.reason || '').replace(/\s+/g, ' ').trim();
      if (reason.length < MIN_REASON) fail('El motivo en ' + PILLAR_NAMES[pid] + ' necesita al menos ' + MIN_REASON + ' caracteres.');
      if (reason.length > MAX_REASON) fail('El motivo en ' + PILLAR_NAMES[pid] + ' supera los ' + MAX_REASON + ' caracteres.');
      rows.push({ pillar: pid, nominee: n.nominee, reason: reason });
    });
    store.addBallots('nom', cfg.cycleId, rows);
    store.addParticipation(cfg.cycleId, 'nom', personId, now);
    return publicState(store, personId, now);
  }

  function vote(store, personId, votes, now) {
    var cfg = store.getConfig();
    var people = store.getPeople();
    var idx = peopleIndex(people);
    var me = idx[personId];
    if (!me || !me.active) fail('No encontramos tu nombre en el equipo activo.');
    requireStage(cfg, 'finalistas');
    if (now > cfg.finDeadline) fail('El plazo de la votación final ya terminó.');
    var part = store.getParticipation(cfg.cycleId);
    if (participationMap(part, 'fin')[personId]) fail('Ya enviaste tu voto final.');
    var rows = [];
    PILLARS.forEach(function (pid) {
      var eligible = (cfg.finalists[pid] || []).filter(function (id) { return id !== personId; });
      var v = votes ? votes[pid] : null;
      if (!eligible.length) { rows.push({ pillar: pid, nominee: '' }); return; }
      if (!v) fail('Falta tu voto en ' + PILLAR_NAMES[pid] + '.');
      if (v === personId) fail('No puedes votar por ti.');
      if (eligible.indexOf(v) < 0) fail('Esa persona no es finalista en ' + PILLAR_NAMES[pid] + '.');
      rows.push({ pillar: pid, nominee: v });
    });
    store.addBallots('fin', cfg.cycleId, rows);
    store.addParticipation(cfg.cycleId, 'fin', personId, now);
    return publicState(store, personId, now);
  }

  /* ---------- Administrador ---------- */
  function adminState(store, now) {
    var cfg = store.getConfig();
    var people = store.getPeople();
    var idx = peopleIndex(people);
    var st = cfg.stage || 'idle';
    var part = cfg.cycleId ? store.getParticipation(cfg.cycleId) : [];
    var nomMap = participationMap(part, 'nom');
    var finMap = participationMap(part, 'fin');
    var out = {
      serverNow: now,
      cycle: { month: cfg.month || '', stage: st, nomDeadline: cfg.nomDeadline || null, finDeadline: cfg.finDeadline || null },
      participation: activePeople(people).map(function (p) {
        return { id: p.id, nom: nomMap[p.id] || null, fin: finMap[p.id] || null };
      }),
      nomTally: null, finTally: null, preview: null, finalists: cfg.finalists || null, winners: null
    };
    if (st !== 'idle' && cfg.cycleId) {
      var nomB = store.getBallots('nom', cfg.cycleId);
      out.nomTally = {};
      PILLARS.forEach(function (pid) {
        out.nomTally[pid] = {
          rows: tally(nomB, pid, idx),
          skips: nomB.filter(function (b) { return b.pillar === pid && !b.nominee; }).length
        };
      });
      if (st === 'nominacion') out.preview = computeFinalists(nomB, people);
      if (st !== 'nominacion') {
        var finB = store.getBallots('fin', cfg.cycleId);
        out.finTally = {};
        PILLARS.forEach(function (pid) {
          var t = tally(finB, pid, idx);
          var m = {};
          t.forEach(function (x) { m[x.id] = x.votes; });
          out.finTally[pid] = (cfg.finalists[pid] || []).map(function (id) { return { id: id, votes: m[id] || 0 }; })
            .sort(function (a, b) { return b.votes - a.votes; });
        });
      }
      if (cfg.winners) {
        out.winners = {};
        PILLARS.forEach(function (pid) { out.winners[pid] = cfg.winners[pid].winners; });
      }
    }
    return out;
  }

  function adminOpen(store, month, deadline, now) {
    var cfg = store.getConfig();
    requireStage(cfg, 'idle');
    month = String(month || '').trim();
    if (!month || month.length > 40) fail('Elige el mes que se evalúa.');
    var ts = validDeadline(deadline, now);
    store.setConfig({
      cycleId: 'c' + now + '-' + Math.random().toString(36).slice(2, 8), month: month, stage: 'nominacion',
      nomDeadline: ts, finDeadline: null, finalists: null, winners: null
    });
  }

  function adminCloseNom(store, deadline, now) {
    var cfg = store.getConfig();
    requireStage(cfg, 'nominacion');
    var ts = validDeadline(deadline, now);
    var finalists = computeFinalists(store.getBallots('nom', cfg.cycleId), store.getPeople());
    store.setConfig({ stage: 'finalistas', finalists: finalists, finDeadline: ts });
  }

  function adminCloseFinal(store, now) {
    var cfg = store.getConfig();
    requireStage(cfg, 'finalistas');
    var winners = computeWinners(store.getBallots('fin', cfg.cycleId), store.getBallots('nom', cfg.cycleId), cfg.finalists, store.getPeople());
    store.setConfig({ stage: 'cerrado', winners: winners });
  }

  function adminReveal(store) {
    requireStage(store.getConfig(), 'cerrado');
    store.setConfig({ stage: 'revelado' });
  }

  function adminExtend(store, deadline, now) {
    var cfg = store.getConfig();
    var ts = validDeadline(deadline, now);
    if (cfg.stage === 'nominacion') store.setConfig({ nomDeadline: ts });
    else if (cfg.stage === 'finalistas') store.setConfig({ finDeadline: ts });
    else fail('Solo puedes cambiar la fecha límite con una votación abierta.');
  }

  function adminArchive(store) {
    var cfg = store.getConfig();
    requireStage(cfg, 'revelado');
    var w = {};
    PILLARS.forEach(function (pid) { w[pid] = (cfg.winners[pid] || { winners: [] }).winners; });
    store.addHistory({ month: cfg.month, winners: w });
    store.setConfig({ cycleId: '', month: '', stage: 'idle', nomDeadline: null, finDeadline: null, finalists: null, winners: null });
  }

  /* ---------- Punto de entrada único ---------- */
  function handle(store, auth, name, args, now) {
    args = args || [];
    try {
      var data;
      var admin = function () {
        if (!auth.check(args[0])) fail('Tu sesión de administrador expiró. Ingresa el PIN de nuevo.');
      };
      switch (name) {
        case 'state': data = publicState(store, args[0], now); break;
        case 'nominate': data = nominate(store, args[0], args[1], now); break;
        case 'vote': data = vote(store, args[0], args[1], now); break;
        case 'adminLogin':
          if (auth.fails() >= MAX_PIN_FAILS) fail('Demasiados intentos. Espera 10 minutos.');
          if (String(args[0]) !== String(store.getAdminPin())) { auth.addFail(); fail('PIN incorrecto. Intenta de nuevo.'); }
          auth.resetFails();
          data = { token: auth.issue() };
          break;
        case 'admin': admin(); data = adminState(store, now); break;
        case 'adminOpen': admin(); adminOpen(store, args[1], args[2], now); data = adminState(store, now); break;
        case 'adminCloseNom': admin(); adminCloseNom(store, args[1], now); data = adminState(store, now); break;
        case 'adminCloseFinal': admin(); adminCloseFinal(store, now); data = adminState(store, now); break;
        case 'adminReveal': admin(); adminReveal(store); data = adminState(store, now); break;
        case 'adminExtend': admin(); adminExtend(store, args[1], now); data = adminState(store, now); break;
        case 'adminArchive': admin(); adminArchive(store); data = adminState(store, now); break;
        default: fail('Acción desconocida.');
      }
      return JSON.stringify({ ok: true, data: data });
    } catch (e) {
      return JSON.stringify({ ok: false, error: e.userFacing ? e.message : 'Algo falló en el servidor. Intenta de nuevo en un momento.', detail: e.userFacing ? undefined : String(e && e.stack || e) });
    }
  }

  return {
    PILLARS: PILLARS, STAGES: STAGES, MIN_REASON: MIN_REASON,
    tally: tally, computeFinalists: computeFinalists, computeWinners: computeWinners,
    publicState: publicState, adminState: adminState, handle: handle
  };
})();

/* Hojas de confirmación */
function pad2(n){return String(n).padStart(2,'0')}
function toLocalInput(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes())}

var SHEETS={
 open:function(){return {title:'Abrir nominación',body:'<div class="field"><label for="fMonth">Mes que se evalúa</label><select id="fMonth">'+monthOptions().map(function(m){return '<option'+(m===currentMonthName()?' selected':'')+'>'+m+'</option>'}).join('')+'</select></div>'+

 toFinal:function(){var f=A.preview||{};var tie=PILLARS.some(function(p){return (f[p.id]||[]).length>3});var empty=PILLARS.filter(function(p){return !(f[p.id]||[]).length});
   return {title:'Cerrar nominación',body:'<p class="lead">Votaron '+aCount()+' de '+A.participation.length+'. Estos son los finalistas que se anunciarán:</p>'+

   (tie?'<p class="small">Hay un empate en el tercer lugar: pasan todas las personas empatadas.</p>':'')+

 toClose:function(){return {title:'Cerrar votación final',body:'<p class="lead">Votaron '+aCount()+' de '+A.participation.length+'. Al cerrar se calculan los ganadores y quedan guardados sin mostrarse al equipo hasta que los reveles.</p>',ok:'Cerrar y calcular ganadores'}},
 toReveal:function(){return {title:'Mostrar ganadores',body:'<p class="lead">Todo el equipo verá la revelación y los reconocimientos. Esto no se puede ocultar después.</p>',ok:'Mostrar a todos'}},

 archive:function(){return {title:'Cerrar el mes',body:'<p class="lead">'+esc(A.cycle.month)+' pasa al Salón de Champions y el panel queda listo para abrir la próxima nominación.</p>',ok:'Cerrar mes'}}
};
function renderSheet(){var o=document.getElementById('overlay');if(!S.sheet){o.innerHTML='';return}var sh=SHEETS[S.sheet]();
 var keep={};['fMonth','fDate'].forEach(function(id){var el=document.getElementById(id);if(el)keep[id]=el.value});
 o.innerHTML='<div class="scrim" data-a="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(sh.title)+'"><span class="grab"></span><b class="h2">'+sh.title+'</b>'+sh.body+'<p class="err" role="alert">'+esc(S.sheetErr)+'</p><button class="btn" data-a="confirmSheet" '+(S.busy?'disabled':'')+'>'+sh.ok+'</button><button class="btn sec sm" data-a="closeSheet">Cancelar</button></div></div>';
 Object.keys(keep).forEach(function(id){var el=document.getElementById(id);if(el)el.value=keep[id]});
}
function confirmSheet(){var k=S.sheet;var dEl=document.getElementById('fDate');var when=dEl&&dEl.value?new Date(dEl.value).getTime():null;
 if(dEl&&(!when||isNaN(when)||when<=now())){S.sheetErr='Elige una fecha y hora futura.';renderSheet();return}
 S.sheetErr='';var t=S.token;var p,msg;
 if(k==='open'){var m=document.getElementById('fMonth').value;p=api('adminOpen',t,m,when);msg='Nominación de '+m+' abierta.'}
 if(k==='toFinal'){p=api('adminCloseNom',t,when);msg='Finalistas anunciados. La votación final está abierta.'}
 if(k==='toClose'){p=api('adminCloseFinal',t);msg='Votación cerrada. Ganadores guardados y ocultos.'}
 if(k==='toReveal'){p=api('adminReveal',t);msg='Ganadores visibles para todo el equipo.'}
 if(k==='extend'){p=api('adminExtend',t,when);msg='Nueva fecha límite: '+fmtDate(when)+'.'}
 if(k==='archive'){p=api('adminArchive',t);msg='Mes cerrado. Ya puedes abrir la próxima nominación.'}
 renderSheet();
 run(p,function(a){setA(a);S.sheet=null;S.flash={msg:msg};S.voteView=a.finTally?'fin':'nom';S.stack=['admin'];render()});
}

/* ---------- Render ---------- */
var USER_TABS=[['home','Inicio','home'],['pillars','Pilares','pillars'],['winners','Ganadores','trophy']];
var ADMIN_TABS=[['admin','Panel','panel'],['adminPeople','Participación','people'],['adminVotes','Votos','chart'],['logout','Salir','out']];
function render(keepScroll){
 timers.forEach(clearTimeout);timers=[];
 var view=document.getElementById('view'),tabs=document.getElementById('tabs');var s=cur();var y=view.scrollTop;
 view.innerHTML='<div class="screenwrap'+(keepScroll?'':' enter')+'">'+V[s]()+'</div>';
 view.scrollTop=keepScroll?y:0;
 tabs.hidden=['loading','login','disclaimer','pin','reveal'].indexOf(s)>=0||(!S.token&&!S.who);
 var T=S.token?ADMIN_TABS:USER_TABS;var root=S.stack[0];
 tabs.innerHTML=T.map(function(t){return '<button data-a="tab" data-s="'+t[0]+'" aria-current="'+(root===t[0])+'">'+ICON[t[2]]+t[1]+'<span class="dot"></span></button>'}).join('');
 renderSheet();bindInputs();
 if(s==='reveal')runReveal();
 S.flash=null;
}
function bindInputs(){
 var q=document.getElementById('q');
 if(q)q.addEventListener('input',function(e){S.q=e.target.value;var pos=e.target.selectionStart;render(true);var n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)});
 var r=document.getElementById('reason');
 if(r)r.addEventListener('input',function(e){S.tmp.reason=e.target.value;var n=reasonLen();document.getElementById('cnt').innerHTML=cntHtml(n);document.getElementById('cnt2').textContent=n+' / '+MIN_REASON+' mín.';document.getElementById('saveR').disabled=n<MIN_REASON});
}
function tick(){var els=document.querySelectorAll('[data-cd]');for(var i=0;i<els.length;i++){var el=els[i];var ts=+el.getAttribute('data-cd');var p=cdParts(ts);var bs=el.querySelectorAll('.digits b');if(bs.length===4){bs[0].textContent=p[0];bs[1].textContent=z(p[1]);bs[2].textContent=z(p[2]);bs[3].textContent=z(p[3])}
 if(now()>ts&&!el.classList.contains('over')&&!S.sheet&&!document.getElementById('reason'))render(true)}}
setInterval(tick,1000);

/* Revelación: cuenta 3-2-1, el pin cae, el nombre aparece letra a letra, confeti y luego los motivos */
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function runReveal(){
 if(!G.winners)return;
 if(S.reveal.i>=PILLARS.length){confetti(60);return}
 if(S.reveal.phase==='count'){
  if(reduce){S.reveal.phase='show';render();return}
  var c=document.getElementById('c3');
  [['2',700],['1',1400]].forEach(function(x){timers.push(setTimeout(function(){if(c){c.textContent=x[0];c.style.animation='none';void c.offsetWidth;c.style.animation=''}},x[1]))});
  timers.push(setTimeout(function(){S.reveal.phase='show';render()},2100));
 }else{timers.push(setTimeout(function(){confetti(140)},900))}
}
function confetti(n){if(reduce)return;var cv=document.getElementById('confetti');if(!cv)return;var app=document.getElementById('app');var w=cv.width=app.clientWidth,h=cv.height=app.clientHeight;var ctx=cv.getContext('2d');
 var cols=['#B2D5AD','#B6AAD1','#B9D5D1','#C6ECBB','#A69BCB','#2C2C2B'];
 var ps=[];for(var i=0;i<n;i++)ps.push({x:w/2+(Math.random()-.5)*60,y:h*.3,vx:(Math.random()-.5)*9,vy:-Math.random()*11-3,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,s:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)]});
 var start=null;
 function f(t){if(start===null)start=t;var k=(t-start)/1000;ctx.clearRect(0,0,w,h);ps.forEach(function(p){p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.globalAlpha=Math.max(0,1-k/3);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
  if(k<3.2&&document.getElementById('confetti')===cv)requestAnimationFrame(f);else ctx.clearRect(0,0,w,h)}
 requestAnimationFrame(f);
}

/* ---------- Acciones ---------- */
function go(s){S.stack.push(s);render()}
function root(s){S.stack=[s];render()}
function refresh(){return api('state',S.who).then(function(g){setG(g)})}
function enterAs(id){S.who=id;sset('rk-who',id);loadDraft();root('home')}
document.getElementById('app').addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t||t.disabled||S.busy)return;
 var a=t.getAttribute('data-a'),pid=t.getAttribute('data-p');
 if(a==='closeSheet'&&t.classList.contains('scrim')&&e.target!==t)return;
 switch(a){
  case 'retry':S.fatal=null;render();boot();break;
  case 'who':S.pending=t.getAttribute('data-id');S.q='';go('disclaimer');break;
  case 'accept':run(api('state',S.pending),function(g){setG(g);enterAs(S.pending)});break;
  case 'switch':S.who=null;sset('rk-who',null);S.q='';root('login');break;
  case 'back':S.stack.pop();if(!S.stack.length)S.stack=[S.token?'admin':S.who?'home':'login'];S.pin='';S.pinErr='';render();break;
  case 'tab':{var s=t.getAttribute('data-s');
    if(s==='logout'){S.token=null;sset('rk-token',null,'s');S.pin='';root(S.who?'home':'login');break}
    if(S.token){run(api('admin',S.token),function(x){setA(x);root(s)});break}
    if(G&&S.who){run(refresh(),function(){root(s)});break}
    root(s);break}
  case 'toPin':S.pin='';S.pinErr='';go('pin');break;
  case 'pillar':S.cur=pid;go('pillar');break;
  case 'nominate':{if(stage()!=='nominacion'||G.me.votedNom||expired())return;S.cur=pid;var n=S.draft[pid];S.tmp=n&&!n.skip?{nominee:n.nominee,reason:n.reason}:{nominee:null,reason:''};S.q='';go('choose');break}
  case 'pick':S.tmp.nominee=t.getAttribute('data-id');render(true);break;
  case 'skip':S.draft[S.cur]={skip:true};saveDraft();S.flash={msg:PL(S.cur).name+' queda sin nominación.'};root('home');break;
  case 'toReason':go('reason');break;
  case 'start':S.tmp.reason=t.getAttribute('data-t');render(true);var ta=document.getElementById('reason');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}break;
  case 'saveReason':{S.draft[S.cur]={nominee:S.tmp.nominee,reason:S.tmp.reason.replace(/\s+/g,' ').trim()};saveDraft();var np=PILLARS.filter(function(p){return !S.draft[p.id]})[0];
    S.flash={msg:'Nominaste a '+P(S.tmp.nominee).name+' en '+PL(S.cur).name+'.'+(np?' Te falta '+np.name+'.':' Ya puedes revisar y enviar.')};root('home');break}
  case 'review':go('review');break;
  case 'sendNom':run(api('nominate',S.who,S.draft),function(g){setG(g);S.draft={};saveDraft();S.flash={msg:'Nominaciones enviadas. ¡Gracias por reconocer!'};root('home')});break;
  case 'final':S.cur=pid;go('final');break;
  case 'fpick':S.fdraft[S.cur]=t.getAttribute('data-id');saveDraft();render(true);break;
  case 'fsave':{var nf=PILLARS.filter(function(p){return eligible(p.id).length&&!S.fdraft[p.id]})[0];S.flash={msg:'Voto guardado en '+PL(S.cur).name+'.'+(nf?' Te falta '+nf.name+'.':' Ya puedes enviar.')};root('home');break}
  case 'fsend':run(api('vote',S.who,S.fdraft),function(g){setG(g);S.fdraft={};saveDraft();S.flash={msg:'Voto final enviado. Gracias.'};root('home')});break;
  case 'startReveal':run(refresh(),function(){S.reveal={i:0,phase:'count'};go('reveal')});break;
  case 'adminReveal':run(api('state',null),function(g){setG(g);S.reveal={i:0,phase:'count'};go('reveal')});break;
  case 'nextReveal':S.reveal={i:S.reveal.i+1,phase:'count'};render();break;
  case 'exitReveal':S.stack=[S.token?'admin':'winners'];render();break;
  case 'key':{var k=t.getAttribute('data-k');S.pinErr='';if(k==='del')S.pin=S.pin.slice(0,-1);else if(S.pin.length<4)S.pin+=k;
    if(S.pin.length===4){var pin=S.pin;S.pin='';render(true);busy(true);
      api('adminLogin',pin).then(function(d){S.token=d.token;sset('rk-token',d.token,'s');return api('admin',d.token)})
        .then(function(x){busy(false);setA(x);root('admin')})
        .catch(function(err){busy(false);S.pinErr=err.message;render(true)});
      break}
    render(true);break}
  case 'sheet':S.sheet=t.getAttribute('data-s');S.sheetErr='';renderSheet();break;
  case 'closeSheet':S.sheet=null;S.sheetErr='';renderSheet();break;
  case 'confirmSheet':confirmSheet();break;
  case 'filter':S.peopleFilter=t.getAttribute('data-f');render(true);break;
  case 'vview':S.voteView=t.getAttribute('data-v');render(true);break;
  case 'copyMissing':{var k2=A.cycle.stage==='finalistas'?'fin':'nom';var txt=A.participation.filter(function(x){return !x[k2]}).map(function(x){return P(x.id).name}).join(', ');var msg=document.getElementById('copyMsg');
    var ok=function(){msg.textContent='Copiado: '+txt};var no=function(){msg.textContent=txt};try{navigator.clipboard.writeText(txt).then(ok,no)}catch(err){no()}break}
 }
});

/* Refresco suave cada 45 s en pantallas de consulta */
setInterval(function(){if(S.busy||S.sheet||document.hidden)return;var s=cur();
 if(S.token&&['admin','adminPeople','adminVotes'].indexOf(s)>=0)api('admin',S.token).then(function(x){setA(x);render(true)}).catch(function(){});
 else if(S.who&&['home','winners'].indexOf(s)>=0)refresh().then(function(){render(true)}).catch(function(){});
},45000);

function boot(){
 S.who=sget('rk-who');S.token=sget('rk-token','s');
 api('state',S.who).then(function(g){setG(g);
  if(S.token)return api('admin',S.token).then(function(x){setA(x);root('admin')}).catch(function(){S.token=null;sset('rk-token',null,'s');finishBoot()});
  finishBoot();
 }).catch(function(e){S.fatal=e.message;root('loading')});
}
function finishBoot(){if(S.who&&G.me){loadDraft();root('home')}else{S.who=null;sset('rk-who',null);root('login')}}

window.__rk={S:S,render:render,get G(){return G},get A(){return A}};
render();boot();
</script>
