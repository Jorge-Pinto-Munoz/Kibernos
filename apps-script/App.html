<script>
/* Rekonoce · cliente. Toda la data viene del servidor por api(); aquí solo hay vista y navegación. */
var PILLARS=[
 {id:'colaboracion',name:'Colaboración',symbol:'La hormiga',art:'la hormiga',tag:'Tu colaboración nos hace imparables.',
  desc:'La hormiga sabe que sola no llega lejos, pero en equipo logra lo imposible. Al compartir conocimientos y poner al grupo por sobre lo individual se multiplica la fuerza del equipo.',
  ask:'¿Quién compartió lo que sabe, apoyó sin reservas y empujó al equipo hacia la meta común?',
  when:['Comparte lo que sabe sin guardárselo','Apoya a otra persona o área sin que se lo pidan','Pone la meta del equipo por sobre la propia'],
  starts:['Me ayudó con ','Compartió ','Se sumó sin que se lo pidieran a ']},
 {id:'responsabilidad',name:'Responsabilidad',symbol:'La antorcha',art:'la antorcha',tag:'Tu responsabilidad mantiene la luz encendida.',
  desc:'La antorcha representa el deber y la continuidad: no basta con sostenerla, también hay que cuidarla y pasarla. Así es tu compromiso, que asegura la calidad, inspira confianza y guía al equipo hacia adelante.',
  ask:'¿Quién mantuvo encendida la llama del compromiso, incluso cuando nadie estaba mirando?',
  when:['Cumple lo que promete, en plazo y con calidad','Se hace cargo cuando algo sale mal','Deja todo listo para que otro pueda seguir'],
  starts:['Cumplió con ','Se hizo cargo de ','Dejó listo ']},
 {id:'respeto',name:'Respeto',symbol:'El torii japonés',art:'el torii',tag:'Tu respeto abre caminos para todos y todas.',
  desc:'El torii japonés nos recuerda que cada persona es un espacio sagrado. Tu respeto abre puertas, cuida la dignidad y construye confianza, creando un ambiente seguro donde todos podemos crecer.',
  ask:'¿Quién escuchó con atención plena, cuidó las palabras y nos hizo sentir valorados y seguros?',
  when:['Escucha con atención plena','Cuida las palabras, también en los momentos tensos','Hace sentir a otros valorados y seguros'],
  starts:['Me escuchó cuando ','Cuidó al equipo en ','Me hizo sentir ']},
 {id:'comunicacion',name:'Comunicación',symbol:'La caracola',art:'la caracola',tag:'Tu comunicación conecta y hace que todo fluya.',
  desc:'La caracola, usada desde la antigüedad para transmitir mensajes, simboliza claridad y unión. Tu comunicación logra que las ideas se entiendan, conecta a las personas y asegura que avancemos en sintonía.',
  ask:'¿Quién logró que las ideas fluyeran, que los mensajes llegaran claros y que el equipo siguiera unido?',
  when:['Explica con claridad y a tiempo','Conecta a personas que necesitaban hablar','Mantiene al equipo informado y en sintonía'],
  starts:['Nos mantuvo al tanto de ','Explicó con claridad ','Conectó a ']}
];
var AREAS={delivery:'Delivery',talent:'Talent Acquisition',support:'Delivery Support'};
var MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var MIN_REASON=40;

var G=null, A=null, offset=0;
var S={stack:['loading'],who:null,token:null,draft:{},fdraft:{},tmp:null,cur:null,q:'',pin:'',pinErr:'',flash:null,sheet:null,sheetErr:'',
  reveal:{i:0,phase:'count'},peopleFilter:'all',voteView:'nom',busy:false,fatal:null};
var timers=[];

/* ---------- Utilidades ---------- */
function store(kind){try{return kind==='s'?window.sessionStorage:window.localStorage}catch(e){return null}}
function sget(k,kind){var s=store(kind);try{return s?s.getItem(k):null}catch(e){return null}}
function sset(k,v,kind){var s=store(kind);try{if(s){if(v==null)s.removeItem(k);else s.setItem(k,v)}}catch(e){}}
function now(){return Date.now()+offset}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function people(){return G?G.people:[]}
function active(){return people().filter(function(p){return p.active})}
function P(id){var ps=people();for(var i=0;i<ps.length;i++)if(ps[i].id===id)return ps[i];return {id:id,name:'Persona',area:'support',note:'',active:false}}
function PL(id){for(var i=0;i<PILLARS.length;i++)if(PILLARS[i].id===id)return PILLARS[i]}
function first(n){return n.split(' ')[0]}
function ini(n){var w=n.split(' ').filter(function(x){return x&&x[0]===x[0].toUpperCase()});if(!w.length)w=[n];return (w[0][0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase()}
function monthWord(){return G&&G.cycle.month?G.cycle.month.split(' ')[0]:''}

function api(name){
  var args=[].slice.call(arguments,1);
  return new Promise(function(res,rej){
    google.script.run
      .withSuccessHandler(function(s){var r;try{r=JSON.parse(s)}catch(e){rej(new Error('Respuesta inválida del servidor.'));return}r.ok?res(r.data):rej(new Error(r.error))})
      .withFailureHandler(function(){rej(new Error('No pudimos conectar con el servidor. Revisa tu conexión e intenta de nuevo.'))})
      .rkApi(name,args);
  });
}
function setG(g){G=g;offset=g.serverNow-Date.now()}
function setA(a){A=a;offset=a.serverNow-Date.now()}
function busy(on){S.busy=on;var b=document.getElementById('busy');if(b)b.hidden=!on}
function run(promise,onOk){busy(true);return promise.then(function(d){busy(false);onOk(d)}).catch(function(e){busy(false);onError(e)})}
function onError(e){
  if(/sesión de administrador expiró/.test(e.message)){S.token=null;sset('rk-token',null,'s');S.sheet=null;S.stack=['pin'];S.pinErr=e.message;render();return}
  if(S.sheet){S.sheetErr=e.message;renderSheet();return}
  S.flash={msg:e.message,err:true};render();
}
function saveDraft(){if(S.who)sset('rk-draft-'+S.who,JSON.stringify({cycle:G&&G.cycle.month,draft:S.draft,fdraft:S.fdraft}))}
function loadDraft(){S.draft={};S.fdraft={};var raw=sget('rk-draft-'+S.who);if(!raw)return;try{var d=JSON.parse(raw);if(d.cycle===(G&&G.cycle.month)){S.draft=d.draft||{};S.fdraft=d.fdraft||{}}}catch(e){}}

/* ---------- Íconos y piezas ---------- */
var ICON={
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ink-3);flex:0 0 auto"><path d="M9 5l7 7-7 7"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4" stroke-linecap="round"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20h-5.5v-5h-5v5H4z"/></svg>',
 pillars:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
 trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><path d="M9 13.5L7.5 20l4.5-2.5 4.5 2.5-1.5-6.5"/></svg>',
 people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="8.5" r="3.5"/><path d="M3 19c.8-3.2 3.2-4.8 6-4.8s5.2 1.6 6 4.8" stroke-linecap="round"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.3c2.3.2 3.8 1.6 4.5 4.2" stroke-linecap="round"/></svg>',
 chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>',
 panel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 9v11"/></svg>',
 out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v14h-5M10 8l-4 4 4 4M6 12h10"/></svg>',
 shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4" stroke-linecap="round"/></svg>',
 lock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="flex:0 0 auto"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
 check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
function medal(pid,size,cls){var i=Math.round(size*.62);return '<span class="medal '+(cls||'')+'" style="width:'+size+'px;height:'+size+'px"><img src="'+PIN_SRC[pid]+'" alt="" width="'+i+'" height="'+i+'" style="width:'+i+'px;height:'+i+'px"></span>'}
function av(p,size){size=size||40;var src=window.AVATAR_SRC&&AVATAR_SRC[p.id];
 return '<span class="av a-'+p.area+'" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.32)+'px" aria-hidden="true">'+
  (src?'<img src="'+src+'" alt="" width="'+size+'" height="'+size+'" style="width:'+size+'px;height:'+size+'px">':esc(ini(p.name)))+'</span>'}
function cur(){return S.stack[S.stack.length-1]}
function appbar(right){return '<div class="appbar"><button class="back" data-a="back">'+ICON.back+'Volver</button><span class="small">'+(right||'')+'</span></div>'}
function head(k,t,lead){return '<div class="hgroup"><span class="kicker">'+k+'</span><span class="ray"></span><h1 class="h1">'+t+'</h1>'+(lead?'<p class="lead">'+lead+'</p>':'')+'</div>'}
function flash(){if(!S.flash)return '';return '<div class="toast'+(S.flash.err?' err':'')+'" role="'+(S.flash.err?'alert':'status')+'">'+(S.flash.err?'':ICON.check)+'<span>'+esc(S.flash.msg)+'</span></div>'}
function fmtDate(ts){if(!ts)return '';var d=new Date(ts);return d.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'})+', '+d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}
function cdParts(ts){var s=Math.max(0,Math.floor((ts-now())/1000));var d=Math.floor(s/86400);s-=d*86400;var h=Math.floor(s/3600);s-=h*3600;var m=Math.floor(s/60);s-=m*60;return [d,h,m,s]}
function z(n){return String(n).padStart(2,'0')}
function stage(c){c=c||(G&&G.cycle);return c?c.stage:'idle'}
function deadlineOf(c){return c.stage==='nominacion'?c.nomDeadline:c.stage==='finalistas'?c.finDeadline:null}
function expired(c){var d=deadlineOf(c||G.cycle);return !!d&&now()>d}
function countdown(c,label){var ts=deadlineOf(c);if(!ts)return '';var over=now()>ts;var p=cdParts(ts);
  return '<div class="cd '+(over?'over':'')+'" data-cd="'+ts+'"><div class="lbl"><span>'+(over?'El plazo terminó':label)+'</span><b>'+fmtDate(ts)+'</b></div><div class="digits">'+
  [[p[0],'días'],[z(p[1]),'horas'],[z(p[2]),'min'],[z(p[3]),'seg']].map(function(x){return '<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join('')+'</div></div>'}

/* ---------- Pantallas ---------- */
var V={};
V.loading=function(){return S.fatal?'<div class="center-screen"><span class="wm">KIBERNUM</span><b class="h2">No pudimos cargar Rekonoce</b><p class="lead">'+esc(S.fatal)+'</p><button class="btn" data-a="retry" style="max-width:260px">Intentar de nuevo</button></div>':
  '<div class="center-screen"><span class="wm">KIBERNUM</span><span class="ray"></span><p class="lead">Cargando Rekonoce…</p></div>'};

V.login=function(){var q=S.q.toLowerCase();
 var groups=Object.keys(AREAS).map(function(a){var ps=people().filter(function(x){return x.area===a&&x.name.toLowerCase().indexOf(q)>=0});if(!ps.length)return '';
  return '<div class="group"><div class="gh">'+AREAS[a]+'<span>'+people().filter(function(x){return x.area===a}).length+' personas</span></div>'+ps.map(function(x){return '<button class="person" data-a="who" data-id="'+x.id+'" '+(x.active?'':'disabled')+'>'+av(x)+'<span class="t"><b>'+esc(x.name)+'</b><small>'+(x.active?esc(x.note||AREAS[x.area]):esc(x.note||'No participa')+' · no participa este mes')+'</small></span>'+(x.active?ICON.chev:'')+'</button>'}).join('')+'</div>'}).join('');
 return '<div class="pad" style="background:var(--warm);padding-top:18px;min-height:100%">'+flash()+
  '<div class="topline"><span class="kicker">Kiber Champions</span><span class="wm">KIBERNUM</span></div>'+
  '<div class="hgroup" style="gap:12px"><span class="ray"></span><h1 class="h1" style="font-size:40px;line-height:1.05">Rekonoce</h1><p class="lead">Reconocer para crecer. Cada mes elegimos juntos a los Kiber Champions de cada pilar.</p></div>'+
  '<div class="pins2">'+PILLARS.map(function(p){return '<div>'+medal(p.id,46)+'<small>'+p.name+'</small></div>'}).join('')+'</div>'+
  '<div class="card" style="background:var(--bg);gap:12px"><b class="h2" style="font-size:15px">¿Quién eres?</b>'+
  '<label class="search">'+ICON.search+'<input id="q" type="search" placeholder="Busca tu nombre" value="'+esc(S.q)+'" autocomplete="off" aria-label="Busca tu nombre"></label>'+
  '<div style="display:grid;gap:12px">'+(groups||'<p class="small">No encontramos ese nombre.</p>')+'</div></div>'+
  '<button class="link" data-a="toPin">'+ICON.lock+'Acceso administrador</button></div>'};

V.disclaimer=function(){var x=P(S.pending);return appbar()+'<div class="pad" style="padding-top:4px">'+
  '<div class="shield">'+ICON.shield+'</div>'+
  head('Antes de votar','Hola, '+esc(first(x.name))+'. Tu voto es anónimo.','')+
  '<div class="list">'+[['Nadie sabe por quién votaste','Tus nominaciones y motivos se guardan sin tu nombre. En la app nadie, ni el administrador, puede ver por quién votaste.'],
   ['Tu nombre solo marca que participaste','Lo usamos únicamente para saber si todo el equipo ya votó y recordarle a quien falte.'],
   ['Tus motivos se leen sin firma','Si la persona que nominaste gana, verá lo que escribiste, pero no quién lo escribió.']]
  .map(function(r,i){return '<div class="prow" style="align-items:flex-start"><span class="num" style="font-size:20px;min-width:28px">0'+(i+1)+'</span><span class="t"><b>'+r[0]+'</b><span>'+r[1]+'</span></span></div>'}).join('')+'</div>'+
  '<p class="small">¿No eres '+esc(x.name)+'? Vuelve y elige tu nombre.</p></div>'+
  '<div class="sticky"><button class="btn" data-a="accept">Entendido, continuar</button></div>'};

function homeTop(){var me=P(S.who);return '<div class="topline"><span class="wm">KIBERNUM</span><button data-a="switch" aria-label="Cambiar de persona" style="display:flex;align-items:center;gap:8px;min-height:44px"><span class="small">'+esc(first(me.name))+'</span>'+av(me,34)+'</button></div>'+flash()}
function kpiPart(n){var a=G.activeCount;return '<div class="kpi"><span><b class="g">'+n+'</b><em>de '+a+' ya votaron</em></span><span><b>'+(a-n)+'</b><em>'+((a-n)===1?'persona falta':'personas faltan')+'</em></span></div>'}
function whyCard(){return '<button class="card" data-a="tab" data-s="pillars"><span class="ray"></span><b class="h2" style="font-size:15px">¿Por qué nos reconocemos?</b><span class="small">Los cuatro pilares, qué significa cada pin y qué conductas reconocemos.</span></button>'}

V.home=function(){var st=stage(),me=P(S.who),m=monthWord(),c=G.cycle;
 if(st==='nominacion'){
  if(G.me.votedNom)return '<div class="pad">'+homeTop()+head(m+' · Nominación','Gracias, '+esc(first(me.name))+'. Ya enviaste tus nominaciones.','Los finalistas se anuncian cuando cierre la nominación.')+countdown(c,'La nominación cierra en')+kpiPart(G.counts.nom)+whyCard()+'</div>';
  var done=PILLARS.filter(function(p){return S.draft[p.id]}).length,closed=expired();
  return '<div class="pad">'+homeTop()+head(m+' · Nominación','¿A quién reconoces en '+m.toLowerCase()+'?','Elige a una persona por pilar y cuenta por qué. Al final envías todo junto.')+
   countdown(c,'La nominación cierra en')+
   (closed?'<div class="notice"><b>El plazo terminó.</b><span>Ya no se reciben nominaciones. Espera el anuncio de finalistas.</span></div>':'')+
   '<div class="list">'+PILLARS.map(function(p){var n=S.draft[p.id];var sub=n?(n.skip?'Sin nominación este mes':'Nominaste a '+esc(P(n.nominee).name)):p.tag;
    return '<button class="prow" data-a="nominate" data-p="'+p.id+'" '+(closed?'disabled':'')+'>'+medal(p.id,48,n?'done':'')+'<span class="t"><b>'+p.name+'</b><span>'+sub+'</span></span>'+(n?'<span class="st">'+(n.skip?'Omitido':'Listo')+'</span>':'<span class="st pend">Pendiente</span>')+'</button>'}).join('')+'</div>'+
   '<button class="btn" data-a="review" '+(done<4||closed?'disabled':'')+'>'+(done<4?'Completa los 4 pilares ('+done+'/4)':'Revisar y enviar')+'</button>'+whyCard()+'</div>'}
 if(st==='finalistas'){
  if(G.me.votedFin)return '<div class="pad">'+homeTop()+head(m+' · Finalistas','Listo, '+esc(first(me.name))+'. Tu voto final quedó registrado.','Los ganadores se revelan cuando cierre la votación.')+countdown(c,'La votación final cierra en')+kpiPart(G.counts.fin)+'</div>';
  var need=PILLARS.filter(function(p){return eligible(p.id).length});var fd=need.filter(function(p){return S.fdraft[p.id]}).length,cl=expired();
  return '<div class="pad">'+homeTop()+head(m+' · Finalistas','Ya tenemos finalistas. Elige al Champion de cada pilar.','Cada pilar tiene a sus personas más nominadas.')+
   countdown(c,'La votación final cierra en')+
   (cl?'<div class="notice"><b>El plazo terminó.</b><span>Ya no se reciben votos.</span></div>':'')+
   '<div class="list">'+PILLARS.map(function(p){var f=S.fdraft[p.id];var el=eligible(p.id).length;return '<button class="prow" data-a="final" data-p="'+p.id+'" '+(cl||!el?'disabled':'')+'>'+medal(p.id,48,f?'done':'')+'<span class="t"><b>'+p.name+'</b><span>'+(f?'Votaste por '+esc(P(f).name):el?(G.finalists[p.id].length+' finalistas'):'No hay finalistas por quien votar')+'</span></span>'+(f?'<span class="st">Listo</span>':el?'<span class="st pend">Pendiente</span>':'')+'</button>'}).join('')+'</div>'+
   '<button class="btn" data-a="fsend" '+(fd<need.length||cl?'disabled':'')+'>'+(fd<need.length?'Vota en todos los pilares ('+fd+'/'+need.length+')':'Enviar mi voto final')+'</button></div>'}
 if(st==='cerrado')return '<div class="pad">'+homeTop()+head(m+' · Votación cerrada','Ya tenemos a los Kiber Champions de '+m.toLowerCase()+'.','Se revelan en la reunión de equipo. Mantente atento.')+
   '<div class="pins2">'+PILLARS.map(function(p){return '<div>'+medal(p.id,46)+'<small>'+p.name+'</small></div>'}).join('')+'</div>'+
   '<div class="notice"><b>Resultados guardados.</b><span>Nadie del equipo los conoce todavía.</span></div></div>';
 if(st==='revelado')return '<div class="pad">'+homeTop()+head(m+' · Ganadores','Los Kiber Champions de '+m.toLowerCase()+' ya están aquí.','Mira la revelación pilar por pilar, con lo que el equipo escribió.')+
   '<div class="pins2">'+PILLARS.map(function(p){return '<div>'+medal(p.id,46,'done')+'<small>'+p.name+'</small></div>'}).join('')+'</div>'+
   '<button class="btn" data-a="startReveal">Ver la revelación</button></div>';
 return '<div class="pad">'+homeTop()+head('Sin votación abierta','Pronto abrimos la nominación del próximo mes.','Te avisaremos cuando puedas nominar.')+
   (G.history.length?'<button class="btn sec" data-a="tab" data-s="winners">Ver los últimos Champions</button>':'')+whyCard()+'</div>';
};
function eligible(pid){return (G.finalists&&G.finalists[pid]||[]).filter(function(f){return f.id!==S.who})}

V.pillars=function(){return (S.stack.length>1?appbar():'')+'<div class="pad">'+
  head('Kiber Champions · Los pilares','Por qué nos reconocemos','Porque cuando reconocemos lo mejor de otros, también sacamos lo mejor de nosotros mismos.')+
  '<p class="quote">El reconocimiento no se trata de premios, sino de construir confianza.</p>'+
  '<div class="list">'+PILLARS.map(function(p,i){return '<button class="prow" data-a="pillar" data-p="'+p.id+'"><span class="num">0'+(i+1)+'</span><span class="t"><b>'+p.name+'</b><span>'+p.symbol+'</span></span>'+medal(p.id,44)+'</button>'}).join('')+'</div>'+
  '<div class="card"><span class="ray"></span><b class="h2" style="font-size:15px">Cómo funciona cada mes</b><div style="display:grid;gap:10px;margin-top:4px">'+
  [['Nominación','Eliges a una persona por pilar, con un motivo concreto.'],['Finalistas','Votas entre las 3 personas más nominadas de cada pilar.'],['Ganadores','Los revelamos en la reunión y entregamos el pin.']].map(function(x,i){return '<div style="display:flex;gap:12px"><span class="num" style="font-size:20px;min-width:28px">0'+(i+1)+'</span><span class="small"><b style="color:var(--ink)">'+x[0]+'.</b> '+x[1]+'</span></div>'}).join('')+'</div></div></div>'};

V.pillar=function(){var p=PL(S.cur);var can=G&&S.who&&stage()==='nominacion'&&G.me&&!G.me.votedNom&&!expired();return appbar(p.symbol)+'<div class="pad">'+
  '<div style="display:flex;justify-content:center;padding:4px 0">'+medal(p.id,160)+'</div>'+
  head('Pilar · '+p.symbol,p.name,'')+'<p class="h2" style="font-weight:400;font-size:18px">'+p.tag+'</p><p class="lead">'+p.desc+'</p>'+
  '<div style="display:grid;gap:8px"><span class="kicker">Lo reconocemos cuando alguien</span><div class="list">'+p.when.map(function(w,i){return '<div class="prow" style="min-height:52px"><span class="num" style="font-size:20px;min-width:28px">0'+(i+1)+'</span><span class="t"><b style="font-weight:400;font-size:14px">'+w+'</b></span></div>'}).join('')+'</div></div>'+
  (can?'<button class="btn" data-a="nominate" data-p="'+p.id+'">'+(S.draft[p.id]?'Cambiar mi nominación':'Nominar en '+p.name)+'</button>':'')+'</div>'};

V.choose=function(){var p=PL(S.cur);var sel=S.tmp.nominee;var q=S.q.toLowerCase();
 var groups=Object.keys(AREAS).map(function(a){var ps=people().filter(function(x){return x.area===a&&x.name.toLowerCase().indexOf(q)>=0});if(!ps.length)return '';
  return '<div class="group"><div class="gh">'+AREAS[a]+'<span>'+people().filter(function(x){return x.area===a}).length+' personas</span></div>'+ps.map(function(x){var me=x.id===S.who;var dis=me||!x.active;
   return '<button class="person" role="radio" aria-checked="'+(sel===x.id)+'" '+(dis?'disabled':'')+' data-a="pick" data-id="'+x.id+'">'+av(x)+'<span class="t"><b>'+esc(x.name)+(me?' (tú)':'')+'</b><small>'+(!x.active?esc(x.note||'No participa'):me?'No puedes nominarte':esc(x.note||AREAS[x.area]))+'</small></span><span class="radio"></span></button>'}).join('')+'</div>'}).join('');
 return appbar('Paso 1 de 2')+'<div class="pad" style="padding-bottom:12px">'+
  '<div style="display:flex;gap:14px;align-items:center">'+medal(p.id,56)+'<div class="hgroup" style="gap:4px"><span class="kicker">'+p.name+'</span><p class="small" style="color:var(--ink-2)">'+p.ask+'</p></div></div>'+
  '<label class="search">'+ICON.search+'<input id="q" type="search" placeholder="Buscar por nombre" value="'+esc(S.q)+'" autocomplete="off" aria-label="Buscar por nombre"></label>'+
  '<div style="display:grid;gap:14px" role="radiogroup" aria-label="Personas">'+(groups||'<p class="small">No encontramos a nadie con ese nombre.</p>')+'</div>'+
  '<button class="link" data-a="skip">Este mes no tengo a nadie en '+p.name+'</button></div>'+
  '<div class="sticky"><button class="btn" data-a="toReason" '+(sel?'':'disabled')+'>'+(sel?'Continuar con '+esc(first(P(sel).name)):'Elige a una persona')+'</button></div>'};

function reasonLen(){return (S.tmp.reason||'').replace(/\s+/g,' ').trim().length}
function cntHtml(n){return n<MIN_REASON?'Faltan <b>'+(MIN_REASON-n)+'</b> caracteres':'<b>Listo</b> para guardar'}
V.reason=function(){var p=PL(S.cur);var x=P(S.tmp.nominee);var n=reasonLen();
 return appbar('Paso 2 de 2')+'<div class="pad" style="padding-bottom:12px">'+
  '<div style="display:flex;gap:12px;align-items:center">'+av(x,48)+'<div style="min-width:0"><b style="color:var(--ink);font-weight:600;font-size:16px">'+esc(x.name)+'</b><p class="small">'+p.name+' · '+AREAS[x.area]+'</p></div></div>'+
  head('Tu motivo','¿Qué hizo este mes que merece '+p.art+'?','Cuenta un hecho concreto. Es lo que leeremos si gana.')+
  '<div style="display:grid;gap:8px"><textarea id="reason" maxlength="600" aria-label="Motivo" placeholder="Por ejemplo: en la entrega del cliente nuevo…">'+esc(S.tmp.reason||'')+'</textarea>'+
  '<div class="count"><span id="cnt">'+cntHtml(n)+'</span><span id="cnt2">'+n+' / '+MIN_REASON+' mín.</span></div></div>'+
  '<div style="display:grid;gap:8px"><span class="kicker">Para empezar</span><div class="starts">'+p.starts.map(function(s){return '<button data-a="start" data-t="'+esc(s)+'">'+esc(s.trim())+'…</button>'}).join('')+'</div></div>'+
  '<p class="small" style="display:flex;gap:6px;align-items:center">'+ICON.lock+'Se guarda sin tu nombre.</p></div>'+
  '<div class="sticky"><button class="btn" id="saveR" data-a="saveReason" '+(n<MIN_REASON?'disabled':'')+'>Guardar nominación</button></div>'};

V.review=function(){return appbar('Resumen')+'<div class="pad" style="padding-bottom:12px">'+
  head('Antes de enviar','Revisa tus nominaciones','Una vez enviadas no se pueden cambiar. Así nadie puede rastrear tu voto.')+
  '<div class="list">'+PILLARS.map(function(p){var n=S.draft[p.id];return '<div class="prow" style="align-items:flex-start">'+medal(p.id,40)+'<span class="t"><b>'+p.name+'</b><span>'+(n.skip?'Sin nominación':esc(P(n.nominee).name))+'</span>'+(n.skip?'':'<span class="quote" style="margin-top:6px;font-size:13px">«'+esc(n.reason)+'»</span>')+'</span></div>'}).join('')+'</div></div>'+
  '<div class="sticky"><button class="btn" data-a="sendNom">Enviar mis nominaciones</button></div>'};

V.final=function(){var p=PL(S.cur);var sel=S.fdraft[p.id];var fs=G.finalists[p.id]||[];
 return appbar('Finalistas')+'<div class="pad" style="padding-bottom:12px">'+
  '<div style="display:flex;gap:14px;align-items:center">'+medal(p.id,56)+'<div class="hgroup" style="gap:4px"><span class="kicker">'+p.name+' · '+fs.length+' finalistas</span><p class="small" style="color:var(--ink-2)">Elige a una persona. Cada una aparece con un motivo anónimo que recibió.</p></div></div>'+
  '<div style="display:grid;gap:10px" role="radiogroup" aria-label="Finalistas">'+fs.map(function(f){var x=P(f.id);var me=f.id===S.who;return '<button class="fin" role="radio" aria-checked="'+(sel===f.id)+'" data-a="fpick" data-id="'+f.id+'" '+(me?'disabled':'')+'><span class="row">'+av(x)+'<span class="t"><b>'+esc(x.name)+(me?' (tú)':'')+'</b><span class="small">'+(me?'No puedes votar por ti':AREAS[x.area])+'</span></span><span class="radio"></span></span>'+(f.excerpt?'<span class="quote">«'+esc(f.excerpt)+'»</span>':'')+'</button>'}).join('')+'</div>'+
  '<p class="small">No mostramos cuántos votos tuvo cada finalista, para que elijas por la historia y no por la tendencia.</p></div>'+
  '<div class="sticky"><button class="btn" data-a="fsave" '+(sel?'':'disabled')+'>Guardar voto</button></div>'};

V.reveal=function(){var i=S.reveal.i;var w=G.winners;
 if(!w)return appbar()+'<div class="pad">'+head('Ganadores','Aún no se revelan los ganadores','')+'</div>';
 if(i>=PILLARS.length)return revealSummary();
 var p=PILLARS[i];var win=w[p.id]||{ids:[],votes:0,reasons:[]};
 if(S.reveal.phase==='count')return '<div class="rv"><span class="kicker" style="padding-top:18px">Champion de '+p.name+'</span><span class="ray"></span><div class="count3" aria-live="polite"><span id="c3">3</span></div></div>';
 var names=win.ids.map(function(id){return P(id).name}).join(' y ');
 var letters=Array.from(names).map(function(c,k){return '<span style="animation-delay:'+(.9+k*.035).toFixed(3)+'s">'+(c===' '?'&nbsp;':esc(c))+'</span>'}).join('');
 return '<div class="rv"><canvas class="confetti" id="confetti" aria-hidden="true"></canvas>'+
  '<div class="topline" style="width:100%"><button class="back" data-a="exitReveal">'+ICON.back+'Salir</button><span class="small">'+esc(G.cycle.month)+'</span></div>'+
  '<span class="kicker">Champion de '+p.name+'</span><span class="ray"></span>'+
  '<div class="rings"><span class="r r3"></span><span class="r"></span><span class="r r2"></span>'+medal(p.id,150)+'</div>'+
  (win.ids.length?'<div class="rv-faces rise" style="animation-delay:.8s">'+win.ids.map(function(id){return av(P(id),64)}).join('')+'</div>'+
  '<h1 class="nm" aria-label="'+esc(names)+'">'+letters+'</h1>'+
  '<p class="small rise" style="animation-delay:1.5s">'+(win.ids.length>1?'Pin compartido · ':'')+win.votes+' '+(win.votes===1?'voto':'votos')+' en la final · '+win.reasons.length+' '+(win.reasons.length===1?'reconocimiento':'reconocimientos')+'</p>'+
  '<div class="reasons">'+win.reasons.map(function(r,k){return '<p class="quote rise" style="animation-delay:'+(1.8+k*.25).toFixed(2)+'s">«'+esc(r)+'»</p>'}).join('')+'</div>':'<p class="lead">Este pilar no tuvo votos suficientes este mes.</p>')+
  '<div class="dots rise" style="animation-delay:1.6s">'+PILLARS.map(function(_,k){return '<i class="'+(k===i?'on':'')+'"></i>'}).join('')+'</div>'+
  '<button class="btn rise" style="animation-delay:1.6s" data-a="nextReveal">'+(i===3?'Ver a los 4 Champions':'Siguiente pilar')+'</button></div>'};
function revealSummary(){return '<div class="rv" style="text-align:left;align-items:stretch"><canvas class="confetti" id="confetti" aria-hidden="true"></canvas>'+
  '<div class="topline"><button class="back" data-a="exitReveal">'+ICON.back+'Salir</button><span class="small">'+esc(G.cycle.month)+'</span></div>'+
  head(esc(G.cycle.month),'Los Kiber Champions del mes','Gracias a todos por reconocer lo mejor de los demás.')+
  '<div class="wgrid">'+PILLARS.map(function(p){var ids=(G.winners[p.id]||{ids:[]}).ids;return '<div class="wrow rise">'+medal(p.id,44,'done')+'<span class="t"><span>'+p.name+'</span><b>'+(ids.map(function(id){return esc(P(id).name)}).join(' y ')||'Sin ganador')+'</b></span></div>'}).join('')+'</div>'+
  '<button class="btn" data-a="exitReveal">Listo</button></div>'}

V.winners=function(){var months=[];
 if(stage()==='revelado'&&G.winners){var w={};PILLARS.forEach(function(p){w[p.id]=G.winners[p.id].ids});months.push({month:G.cycle.month,winners:w})}
 months=months.concat(G.history||[]);
 return '<div class="pad">'+head('Kiber Champions','Salón de Champions','Cada fila es un pin entregado. Los ganadores del mes en curso aparecen cuando se revelan.')+
  (stage()==='revelado'?'<button class="btn sec" data-a="startReveal">Ver la revelación de '+esc(monthWord().toLowerCase())+'</button>':'')+
  (months.length?months.map(function(m){return '<div class="wgrid"><div class="topline" style="padding:10px 0 6px"><b class="h2" style="font-size:15px">'+esc(m.month)+'</b><span class="small">4 pines</span></div>'+PILLARS.map(function(p){var ids=m.winners[p.id]||[];return '<div class="wrow">'+medal(p.id,36)+'<span class="t"><span>'+p.name+'</span><b>'+(ids.map(function(id){return esc(P(id).name)}).join(' y ')||'Sin ganador')+'</b></span></div>'}).join('')+'</div>'}).join(''):
   '<div class="notice"><b>Todavía no hay Champions.</b><span>Aquí aparecerán los ganadores de cada mes.</span></div>')+'</div>'};

/* ---------- Administrador ---------- */
V.pin=function(){return appbar()+'<div class="pad">'+head('Administrador','Ingresa el PIN','Solo para quien administra Kiber Champions.')+
  '<div class="pinDots '+(S.pinErr?'shake':'')+'" aria-label="'+S.pin.length+' de 4 dígitos">'+[0,1,2,3].map(function(k){return '<i class="'+(k<S.pin.length?'on':'')+'"></i>'}).join('')+'</div>'+
  '<p class="err" role="alert">'+esc(S.pinErr)+'</p>'+
  '<div class="keypad">'+['1','2','3','4','5','6','7','8','9','','0','del'].map(function(k){return k===''?'<span></span>':'<button data-a="key" data-k="'+k+'" class="'+(k==='del'?'ghost':'')+'" aria-label="'+(k==='del'?'Borrar':k)+'">'+(k==='del'?'Borrar':k)+'</button>'}).join('')+'</div></div>'};

var STAGES=[['nominacion','Nominación'],['finalistas','Finalistas'],['cerrado','Cierre'],['revelado','Ganadores']];
function aCount(){var st=A.cycle.stage;var k=st==='finalistas'?'fin':'nom';return A.participation.filter(function(x){return x[k]}).length}
V.admin=function(){var c=A.cycle,st=c.stage;var idx=-1;STAGES.forEach(function(s,k){if(s[0]===st)idx=k});var n=aCount(),tot=A.participation.length;
 var step=STAGES.map(function(s,k){return '<div class="'+(k<idx?'done':k===idx?'now':'')+'"><i></i><span>'+s[1]+'</span></div>'}).join('');
 var action='';
 if(st==='idle')action='<div class="card"><span class="kicker">Siguiente paso</span><b class="h2">Abrir la nominación del mes</b><span class="small">Eliges el mes que se evalúa y la fecha límite para nominar.</span><button class="btn" data-a="sheet" data-s="open">Abrir nominación</button></div>';
 if(st==='nominacion')action='<div class="card"><span class="kicker">Siguiente paso</span><b class="h2">Cerrar nominación y anunciar finalistas</b><span class="small">Quedan las 3 personas más nominadas por pilar y se abre la votación final.</span><button class="btn" data-a="sheet" data-s="toFinal">Cerrar y pasar a Finalistas</button><button class="btn sec sm" data-a="sheet" data-s="extend">Cambiar fecha límite</button></div>';
 if(st==='finalistas')action='<div class="card"><span class="kicker">Siguiente paso</span><b class="h2">Cerrar la votación final</b><span class="small">Se calculan los ganadores y quedan guardados sin mostrarse al equipo.</span><button class="btn" data-a="sheet" data-s="toClose">Cerrar votación final</button><button class="btn sec sm" data-a="sheet" data-s="extend">Cambiar fecha límite</button></div>';
 if(st==='cerrado')action='<div class="card"><span class="kicker">Siguiente paso</span><b class="h2">Mostrar a los ganadores</b><span class="small">Todos verán la revelación animada de cada pilar con sus reconocimientos.</span><button class="btn" data-a="sheet" data-s="toReveal">Mostrar ganadores a todos</button></div>';
 if(st==='revelado')action='<div class="card"><span class="kicker">Mes terminado</span><b class="h2">Ganadores publicados</b><span class="small">Proyecta la revelación en la reunión. Cuando termines, cierra el mes para abrir el siguiente.</span><button class="btn" data-a="adminReveal">Proyectar revelación</button><button class="btn sec sm" data-a="sheet" data-s="archive">Cerrar mes y preparar el siguiente</button></div>';
 var open=st==='nominacion'||st==='finalistas';
 return '<div class="pad"><div class="topline"><span class="wm">KIBERNUM</span><span class="st lil">Administrador</span></div>'+flash()+
  head(st==='idle'?'Sin mes abierto':esc(c.month),'Panel de Kiber Champions','')+
  (st!=='idle'?'<div class="stepper" aria-label="Etapa actual">'+step+'</div>':'')+
  (open?countdown(c,st==='nominacion'?'La nominación cierra en':'La votación final cierra en'):'')+
  (open?'<button class="kpi" data-a="tab" data-s="adminPeople"><span><b class="g">'+n+'<small>/'+tot+'</small></b><em>ya votaron</em></span><span><b>'+(tot-n)+'</b><em>faltan · ver quiénes</em></span></button><div class="bar" aria-hidden="true"><i style="width:'+Math.round(n/Math.max(1,tot)*100)+'%"></i></div>':'')+
  action+'</div>'};

V.adminPeople=function(){var st=A.cycle.stage;
 if(st!=='nominacion'&&st!=='finalistas')return '<div class="pad">'+head('Participación','No hay una votación abierta','')+'<p class="lead">Cuando abras una etapa, aquí verás quién ya votó y quién falta.</p></div>';
 var k=st==='finalistas'?'fin':'nom';var rows=A.participation;var missing=rows.filter(function(x){return !x[k]});
 var show=function(x){return S.peopleFilter==='all'||!x[k]};
 var groups=Object.keys(AREAS).map(function(a){var tot=rows.filter(function(x){return P(x.id).area===a});var ps=tot.filter(show);if(!ps.length)return '';
  return '<div class="group"><div class="gh">'+AREAS[a]+'<span>'+tot.filter(function(x){return x[k]}).length+' de '+tot.length+'</span></div>'+ps.map(function(x){var p=P(x.id);return '<div class="person">'+av(p,36)+'<span class="t"><b>'+esc(p.name)+'</b><small>'+(x[k]?'Votó · '+new Date(x[k]).toLocaleDateString('es-CL',{day:'numeric',month:'short'}):'Aún no vota')+'</small></span>'+(x[k]?'<span class="st">Votó</span>':'<span class="st alert">Falta</span>')+'</div>'}).join('')+'</div>'}).join('');
 var away=people().filter(function(p){return !p.active});
 return '<div class="pad">'+head('Participación · '+(st==='finalistas'?'votación final':'nominación'),missing.length?(missing.length===1?'1 persona aún no vota':missing.length+' personas aún no votan'):'Todo el equipo ya votó','Ves quién participó, no por quién votó.')+
  '<div class="seg" role="group" aria-label="Filtro"><button data-a="filter" data-f="all" aria-pressed="'+(S.peopleFilter==='all')+'">Todos ('+rows.length+')</button><button data-a="filter" data-f="missing" aria-pressed="'+(S.peopleFilter==='missing')+'">Faltan ('+missing.length+')</button></div>'+
  (missing.length?'<button class="btn sec sm" data-a="copyMissing">Copiar nombres de quienes faltan</button><p class="small" id="copyMsg" role="status"></p>':'')+
  '<div style="display:grid;gap:14px">'+(groups||'<p class="small">Nadie falta. ¡Todo el equipo votó!</p>')+'</div>'+
  (away.length?'<p class="small">No participan este mes: '+away.map(function(p){return esc(p.name)+(p.note?' ('+esc(p.note.toLowerCase())+')':'')}).join(', ')+'.</p>':'')+'</div>'};

V.adminVotes=function(){var st=A.cycle.stage;
 if(st==='idle'||!A.nomTally)return '<div class="pad">'+head('Votos','No hay votos todavía','Cuando abras la nominación, aquí verás cuántos votos recibe cada persona.')+'</div>';
 var hasFin=!!A.finTally;var view=hasFin?S.voteView:'nom';
 return '<div class="pad">'+head('Votos · '+esc(A.cycle.month),'Por quién se votó','Ves cuántos votos recibió cada persona. Los votos no guardan quién los dio.')+
  (hasFin?'<div class="seg" role="group" aria-label="Ronda"><button data-a="vview" data-v="nom" aria-pressed="'+(view==='nom')+'">Nominación</button><button data-a="vview" data-v="fin" aria-pressed="'+(view==='fin')+'">Finalistas</button></div>':'')+
  PILLARS.map(function(p){var rows=view==='nom'?A.nomTally[p.id].rows:A.finTally[p.id];var max=Math.max.apply(null,[1].concat(rows.map(function(x){return x.votes})));
   var fx=view==='nom'?(A.preview?A.preview[p.id]:(A.finalists?A.finalists[p.id]:[]))||[]:[];var win=A.winners?A.winners[p.id]:[];
   var skips=view==='nom'?A.nomTally[p.id].skips:0;
   return '<div style="display:grid;gap:4px"><div style="display:flex;align-items:center;gap:10px;padding-bottom:4px">'+medal(p.id,32)+'<b class="h2" style="font-size:15px">'+p.name+'</b></div>'+
   (rows.length?rows.map(function(x){var tag=view==='fin'&&win&&win.indexOf(x.id)>=0?' <small>· ganador</small>':fx.indexOf(x.id)>=0?' <small>· finalista</small>':'';return '<div class="vrow"><b>'+esc(P(x.id).name)+tag+'</b><em>'+x.votes+'</em><div class="bar"><i style="width:'+Math.round(x.votes/max*100)+'%"></i></div></div>'}).join(''):'<p class="small">Sin votos todavía.</p>')+
   (skips?'<p class="small">'+skips+' '+(skips===1?'persona omitió':'personas omitieron')+' este pilar.</p>':'')+'</div>'}).join('')+
  (view==='nom'&&st==='nominacion'?'<p class="small">“Finalista” indica quién pasaría si cerraras ahora.</p>':'')+'</div>'};

/* Hojas de confirmación */
function pad2(n){return String(n).padStart(2,'0')}
function toLocalInput(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes())}
function at18(days){var d=new Date(now());d.setDate(d.getDate()+days);d.setHours(18,0,0,0);return d.getTime()}
function monthOptions(){var d=new Date(now());var out=[];for(var k=-2;k<=1;k++){var x=new Date(d.getFullYear(),d.getMonth()+k,1);out.push(MONTHS[x.getMonth()]+' '+x.getFullYear())}return out}
function currentMonthName(){var d=new Date(now());return MONTHS[d.getMonth()]+' '+d.getFullYear()}
var SHEETS={
 open:function(){return {title:'Abrir nominación',body:'<div class="field"><label for="fMonth">Mes que se evalúa</label><select id="fMonth">'+monthOptions().map(function(m){return '<option'+(m===currentMonthName()?' selected':'')+'>'+m+'</option>'}).join('')+'</select></div>'+
   '<div class="field"><label for="fDate">Fecha límite para nominar</label><input id="fDate" type="datetime-local" value="'+toLocalInput(at18(5))+'"></div><p class="small">El contador aparecerá en la pantalla de inicio de todos.</p>',ok:'Abrir nominación'}},
 toFinal:function(){var f=A.preview||{};var tie=PILLARS.some(function(p){return (f[p.id]||[]).length>3});var empty=PILLARS.filter(function(p){return !(f[p.id]||[]).length});
   return {title:'Cerrar nominación',body:'<p class="lead">Votaron '+aCount()+' de '+A.participation.length+'. Estos son los finalistas que se anunciarán:</p>'+
   '<div class="list">'+PILLARS.map(function(p){return '<div class="prow" style="min-height:0">'+medal(p.id,36)+'<span class="t"><b>'+p.name+'</b><span>'+((f[p.id]||[]).map(function(id){return esc(P(id).name)}).join(', ')||'Sin nominaciones')+'</span></span></div>'}).join('')+'</div>'+
   (tie?'<p class="small">Hay un empate en el tercer lugar: pasan todas las personas empatadas.</p>':'')+
   (empty.length?'<p class="small">'+empty.map(function(p){return p.name}).join(', ')+' no tiene nominaciones; ese pilar quedará sin ganador.</p>':'')+
   '<div class="field"><label for="fDate">Fecha límite de la votación final</label><input id="fDate" type="datetime-local" value="'+toLocalInput(at18(3))+'"></div>',ok:'Anunciar finalistas'}},
 toClose:function(){return {title:'Cerrar votación final',body:'<p class="lead">Votaron '+aCount()+' de '+A.participation.length+'. Al cerrar se calculan los ganadores y quedan guardados sin mostrarse al equipo hasta que los reveles.</p>',ok:'Cerrar y calcular ganadores'}},
 toReveal:function(){return {title:'Mostrar ganadores',body:'<p class="lead">Todo el equipo verá la revelación y los reconocimientos. Esto no se puede ocultar después.</p>',ok:'Mostrar a todos'}},
 extend:function(){return {title:'Cambiar fecha límite',body:'<div class="field"><label for="fDate">Nueva fecha límite</label><input id="fDate" type="datetime-local" value="'+toLocalInput(deadlineOf(A.cycle)||at18(2))+'"></div>',ok:'Guardar fecha'}},
 archive:function(){return {title:'Cerrar el mes',body:'<p class="lead">'+esc(A.cycle.month)+' pasa al Salón de Champions y el panel queda listo para abrir la próxima nominación.</p>',ok:'Cerrar mes'}}
};
function renderSheet(){var o=document.getElementById('overlay');if(!S.sheet){o.innerHTML='';return}var sh=SHEETS[S.sheet]();
 var keep={};['fMonth','fDate'].forEach(function(id){var el=document.getElementById(id);if(el)keep[id]=el.value});
 o.innerHTML='<div class="scrim" data-a="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(sh.title)+'"><span class="grab"></span><b class="h2">'+sh.title+'</b>'+sh.body+'<p class="err" role="alert">'+esc(S.sheetErr)+'</p><button class="btn" data-a="confirmSheet" '+(S.busy?'disabled':'')+'>'+sh.ok+'</button><button class="btn sec sm" data-a="closeSheet">Cancelar</button></div></div>';
 Object.keys(keep).forEach(function(id){var el=document.getElementById(id);if(el)el.value=keep[id]});
}
function confirmSheet(){var k=S.sheet;var dEl=document.getElementById('fDate');var when=dEl&&dEl.value?new Date(dEl.value).getTime():null;
 if(dEl&&(!when||isNaN(when)||when<=now())){S.sheetErr='Elige una fecha y hora futura.';renderSheet();return}
 S.sheetErr='';var t=S.token;var p,msg;
 if(k==='open'){var m=document.getElementById('fMonth').value;p=api('adminOpen',t,m,when);msg='Nominación de '+m+' abierta.'}
 if(k==='toFinal'){p=api('adminCloseNom',t,when);msg='Finalistas anunciados. La votación final está abierta.'}
 if(k==='toClose'){p=api('adminCloseFinal',t);msg='Votación cerrada. Ganadores guardados y ocultos.'}
 if(k==='toReveal'){p=api('adminReveal',t);msg='Ganadores visibles para todo el equipo.'}
 if(k==='extend'){p=api('adminExtend',t,when);msg='Nueva fecha límite: '+fmtDate(when)+'.'}
 if(k==='archive'){p=api('adminArchive',t);msg='Mes cerrado. Ya puedes abrir la próxima nominación.'}
 renderSheet();
 run(p,function(a){setA(a);S.sheet=null;S.flash={msg:msg};S.voteView=a.finTally?'fin':'nom';S.stack=['admin'];render()});
}

/* ---------- Render ---------- */
var USER_TABS=[['home','Inicio','home'],['pillars','Pilares','pillars'],['winners','Ganadores','trophy']];
var ADMIN_TABS=[['admin','Panel','panel'],['adminPeople','Participación','people'],['adminVotes','Votos','chart'],['logout','Salir','out']];
function render(keepScroll){
 timers.forEach(clearTimeout);timers=[];
 var view=document.getElementById('view'),tabs=document.getElementById('tabs');var s=cur();var y=view.scrollTop;
 view.innerHTML='<div class="screenwrap'+(keepScroll?'':' enter')+'">'+V[s]()+'</div>';
 view.scrollTop=keepScroll?y:0;
 tabs.hidden=['loading','login','disclaimer','pin','reveal'].indexOf(s)>=0||(!S.token&&!S.who);
 var T=S.token?ADMIN_TABS:USER_TABS;var root=S.stack[0];
 tabs.innerHTML=T.map(function(t){return '<button data-a="tab" data-s="'+t[0]+'" aria-current="'+(root===t[0])+'">'+ICON[t[2]]+t[1]+'<span class="dot"></span></button>'}).join('');
 renderSheet();bindInputs();
 if(s==='reveal')runReveal();
 S.flash=null;
}
function bindInputs(){
 var q=document.getElementById('q');
 if(q)q.addEventListener('input',function(e){S.q=e.target.value;var pos=e.target.selectionStart;render(true);var n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)});
 var r=document.getElementById('reason');
 if(r)r.addEventListener('input',function(e){S.tmp.reason=e.target.value;var n=reasonLen();document.getElementById('cnt').innerHTML=cntHtml(n);document.getElementById('cnt2').textContent=n+' / '+MIN_REASON+' mín.';document.getElementById('saveR').disabled=n<MIN_REASON});
}
function tick(){var els=document.querySelectorAll('[data-cd]');for(var i=0;i<els.length;i++){var el=els[i];var ts=+el.getAttribute('data-cd');var p=cdParts(ts);var bs=el.querySelectorAll('.digits b');if(bs.length===4){bs[0].textContent=p[0];bs[1].textContent=z(p[1]);bs[2].textContent=z(p[2]);bs[3].textContent=z(p[3])}
 if(now()>ts&&!el.classList.contains('over')&&!S.sheet&&!document.getElementById('reason'))render(true)}}
setInterval(tick,1000);

/* Revelación: cuenta 3-2-1, el pin cae, el nombre aparece letra a letra, confeti y luego los motivos */
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function runReveal(){
 if(!G.winners)return;
 if(S.reveal.i>=PILLARS.length){confetti(60);return}
 if(S.reveal.phase==='count'){
  if(reduce){S.reveal.phase='show';render();return}
  var c=document.getElementById('c3');
  [['2',700],['1',1400]].forEach(function(x){timers.push(setTimeout(function(){if(c){c.textContent=x[0];c.style.animation='none';void c.offsetWidth;c.style.animation=''}},x[1]))});
  timers.push(setTimeout(function(){S.reveal.phase='show';render()},2100));
 }else{timers.push(setTimeout(function(){confetti(140)},900))}
}
function confetti(n){if(reduce)return;var cv=document.getElementById('confetti');if(!cv)return;var app=document.getElementById('app');var w=cv.width=app.clientWidth,h=cv.height=app.clientHeight;var ctx=cv.getContext('2d');
 var cols=['#B2D5AD','#B6AAD1','#B9D5D1','#C6ECBB','#A69BCB','#2C2C2B'];
 var ps=[];for(var i=0;i<n;i++)ps.push({x:w/2+(Math.random()-.5)*60,y:h*.3,vx:(Math.random()-.5)*9,vy:-Math.random()*11-3,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,s:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)]});
 var start=null;
 function f(t){if(start===null)start=t;var k=(t-start)/1000;ctx.clearRect(0,0,w,h);ps.forEach(function(p){p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.globalAlpha=Math.max(0,1-k/3);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
  if(k<3.2&&document.getElementById('confetti')===cv)requestAnimationFrame(f);else ctx.clearRect(0,0,w,h)}
 requestAnimationFrame(f);
}

/* ---------- Acciones ---------- */
function go(s){S.stack.push(s);render()}
function root(s){S.stack=[s];render()}
function refresh(){return api('state',S.who).then(function(g){setG(g)})}
function enterAs(id){S.who=id;sset('rk-who',id);loadDraft();root('home')}
document.getElementById('app').addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t||t.disabled||S.busy)return;
 var a=t.getAttribute('data-a'),pid=t.getAttribute('data-p');
 if(a==='closeSheet'&&t.classList.contains('scrim')&&e.target!==t)return;
 switch(a){
  case 'retry':S.fatal=null;render();boot();break;
  case 'who':S.pending=t.getAttribute('data-id');S.q='';go('disclaimer');break;
  case 'accept':run(api('state',S.pending),function(g){setG(g);enterAs(S.pending)});break;
  case 'switch':S.who=null;sset('rk-who',null);S.q='';root('login');break;
  case 'back':S.stack.pop();if(!S.stack.length)S.stack=[S.token?'admin':S.who?'home':'login'];S.pin='';S.pinErr='';render();break;
  case 'tab':{var s=t.getAttribute('data-s');
    if(s==='logout'){S.token=null;sset('rk-token',null,'s');S.pin='';root(S.who?'home':'login');break}
    if(S.token){run(api('admin',S.token),function(x){setA(x);root(s)});break}
    if(G&&S.who){run(refresh(),function(){root(s)});break}
    root(s);break}
  case 'toPin':S.pin='';S.pinErr='';go('pin');break;
  case 'pillar':S.cur=pid;go('pillar');break;
  case 'nominate':{if(stage()!=='nominacion'||G.me.votedNom||expired())return;S.cur=pid;var n=S.draft[pid];S.tmp=n&&!n.skip?{nominee:n.nominee,reason:n.reason}:{nominee:null,reason:''};S.q='';go('choose');break}
  case 'pick':S.tmp.nominee=t.getAttribute('data-id');render(true);break;
  case 'skip':S.draft[S.cur]={skip:true};saveDraft();S.flash={msg:PL(S.cur).name+' queda sin nominación.'};root('home');break;
  case 'toReason':go('reason');break;
  case 'start':S.tmp.reason=t.getAttribute('data-t');render(true);var ta=document.getElementById('reason');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}break;
  case 'saveReason':{S.draft[S.cur]={nominee:S.tmp.nominee,reason:S.tmp.reason.replace(/\s+/g,' ').trim()};saveDraft();var np=PILLARS.filter(function(p){return !S.draft[p.id]})[0];
    S.flash={msg:'Nominaste a '+P(S.tmp.nominee).name+' en '+PL(S.cur).name+'.'+(np?' Te falta '+np.name+'.':' Ya puedes revisar y enviar.')};root('home');break}
  case 'review':go('review');break;
  case 'sendNom':run(api('nominate',S.who,S.draft),function(g){setG(g);S.draft={};saveDraft();S.flash={msg:'Nominaciones enviadas. ¡Gracias por reconocer!'};root('home')});break;
  case 'final':S.cur=pid;go('final');break;
  case 'fpick':S.fdraft[S.cur]=t.getAttribute('data-id');saveDraft();render(true);break;
  case 'fsave':{var nf=PILLARS.filter(function(p){return eligible(p.id).length&&!S.fdraft[p.id]})[0];S.flash={msg:'Voto guardado en '+PL(S.cur).name+'.'+(nf?' Te falta '+nf.name+'.':' Ya puedes enviar.')};root('home');break}
  case 'fsend':run(api('vote',S.who,S.fdraft),function(g){setG(g);S.fdraft={};saveDraft();S.flash={msg:'Voto final enviado. Gracias.'};root('home')});break;
  case 'startReveal':run(refresh(),function(){S.reveal={i:0,phase:'count'};go('reveal')});break;
  case 'adminReveal':run(api('state',null),function(g){setG(g);S.reveal={i:0,phase:'count'};go('reveal')});break;
  case 'nextReveal':S.reveal={i:S.reveal.i+1,phase:'count'};render();break;
  case 'exitReveal':S.stack=[S.token?'admin':'winners'];render();break;
  case 'key':{var k=t.getAttribute('data-k');S.pinErr='';if(k==='del')S.pin=S.pin.slice(0,-1);else if(S.pin.length<4)S.pin+=k;
    if(S.pin.length===4){var pin=S.pin;S.pin='';render(true);busy(true);
      api('adminLogin',pin).then(function(d){S.token=d.token;sset('rk-token',d.token,'s');return api('admin',d.token)})
        .then(function(x){busy(false);setA(x);root('admin')})
        .catch(function(err){busy(false);S.pinErr=err.message;render(true)});
      break}
    render(true);break}
  case 'sheet':S.sheet=t.getAttribute('data-s');S.sheetErr='';renderSheet();break;
  case 'closeSheet':S.sheet=null;S.sheetErr='';renderSheet();break;
  case 'confirmSheet':confirmSheet();break;
  case 'filter':S.peopleFilter=t.getAttribute('data-f');render(true);break;
  case 'vview':S.voteView=t.getAttribute('data-v');render(true);break;
  case 'copyMissing':{var k2=A.cycle.stage==='finalistas'?'fin':'nom';var txt=A.participation.filter(function(x){return !x[k2]}).map(function(x){return P(x.id).name}).join(', ');var msg=document.getElementById('copyMsg');
    var ok=function(){msg.textContent='Copiado: '+txt};var no=function(){msg.textContent=txt};try{navigator.clipboard.writeText(txt).then(ok,no)}catch(err){no()}break}
 }
});

/* Refresco suave cada 45 s en pantallas de consulta */
setInterval(function(){if(S.busy||S.sheet||document.hidden)return;var s=cur();
 if(S.token&&['admin','adminPeople','adminVotes'].indexOf(s)>=0)api('admin',S.token).then(function(x){setA(x);render(true)}).catch(function(){});
 else if(S.who&&['home','winners'].indexOf(s)>=0)refresh().then(function(){render(true)}).catch(function(){});
},45000);

function boot(){
 S.who=sget('rk-who');S.token=sget('rk-token','s');
 api('state',S.who).then(function(g){setG(g);
  if(S.token)return api('admin',S.token).then(function(x){setA(x);root('admin')}).catch(function(){S.token=null;sset('rk-token',null,'s');finishBoot()});
  finishBoot();
 }).catch(function(e){S.fatal=e.message;root('loading')});
}
function finishBoot(){if(S.who&&G.me){loadDraft();root('home')}else{S.who=null;sset('rk-who',null);root('login')}}

window.__rk={S:S,render:render,get G(){return G},get A(){return A}};
render();boot();
</script>
